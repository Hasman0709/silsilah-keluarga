<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin - Bani Yasroji</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f7f3;
    color: #333;
}

header {
    background: #168344;
    color: white;
    padding: 22px 18px;
}

header h2 {
    margin: 0 0 7px;
}

header p {
    margin: 0;
    font-size: 14px;
}

.container {
    padding: 18px;
    max-width: 700px;
    margin: auto;
}

.sambutan {
    background: white;
    padding: 20px;
    border-radius: 13px;
    margin-bottom: 20px;
    box-shadow: 0 3px 10px #0000000d;
}

.sambutan h3 {
    color: #168344;
    margin-top: 0;
}

.menu {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 13px;
}

.menu a {
    background: white;
    text-decoration: none;
    color: #333;
    padding: 22px 12px;
    border-radius: 13px;
    text-align: center;
    box-shadow: 0 3px 10px #0000000d;
    font-weight: bold;
}

.menu a span {
    display: block;
    font-size: 30px;
    margin-bottom: 10px;
}

.tombol-keluar {
    display: block;
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #d9534f;
    color: white;
    font-size: 15px;
    font-weight: bold;
}

#status {
    text-align: center;
    padding: 30px;
    color: #168344;
}

</style>
</head>

<body>

<div id="status">Memeriksa akses admin...</div>

<div id="dashboard" hidden>

<header>
    <h2>Dashboard Admin</h2>
    <p>Pengelolaan Silsilah Keluarga Bani Yasroji</p>
</header>

<div class="container">

    <div class="sambutan">
        <h3>Selamat Datang, Admin!</h3>
        <p>
            Silakan pilih menu untuk mengelola
            data dan informasi keluarga.
        </p>
    </div>

    <div class="menu">

        <a href="anggota.html">
            <span>👨‍👩‍👧‍👦</span>
            Data Anggota
        </a>

        <a href="usulan.html">
            <span>📋</span>
            Usulan Anggota
        </a>

        <a href="silsilah.html">
            <span>🌳</span>
            Pohon Silsilah
        </a>

        <a href="galeri.html">
            <span>🖼️</span>
            Galeri Keluarga
        </a>

        <a href="sejarah.html">
            <span>📖</span>
            Sejarah Keluarga
        </a>

        <a href="index.html">
            <span>🏠</span>
            Halaman Utama
        </a>

    </div>

    <button class="tombol-keluar" id="keluar">
        Keluar dari Dashboard
    </button>

</div>

</div>

<script type="module">

import { auth, db } from "./js/firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const status = document.getElementById("status");
const dashboard = document.getElementById("dashboard");

onAuthStateChanged(auth, async (user) => {

    if (!user) {
        window.location.href = "login.html";
        return;
    }

    try {

        const adminRef = doc(db, "admins", user.uid);
        const adminDoc = await getDoc(adminRef);

        if (!adminDoc.exists() || adminDoc.data().role !== "admin") {

            status.textContent = "Akun ini tidak memiliki hak akses admin.";

            await signOut(auth);

            setTimeout(() => {
                window.location.href = "login.html";
            }, 2000);

            return;
        }

        status.hidden = true;
        dashboard.hidden = false;

    } catch (error) {

        status.textContent = "Gagal memeriksa akses. Periksa koneksi dan aturan Firestore.";

        console.error(error);

    }

});

document.getElementById("keluar").addEventListener("click", async () => {

    await signOut(auth);
    window.location.href = "login.html";

});

</script>

</body>
</html>
