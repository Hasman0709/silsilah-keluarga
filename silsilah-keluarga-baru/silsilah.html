<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pohon Keluarga Bani Yasroji</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f7f3;color:#26352b}header{background:#176b45;color:white;padding:18px;text-align:center}header h2{margin:4px}.kembali{color:white;display:inline-block;margin-top:10px}.container{padding:16px 10px}.status{text-align:center;background:white;padding:14px;border-radius:10px;margin:10px auto;max-width:650px}.pohon{overflow-x:auto;padding:12px 4px 28px}.generasi{display:flex;justify-content:center;align-items:stretch;gap:12px;min-width:max-content;margin:14px auto}.anggota{background:white;width:150px;padding:12px 8px;border-radius:13px;box-shadow:0 3px 10px #0002;border-top:4px solid #198754;text-align:center;white-space:normal}.anggota.perempuan{border-top-color:#bd6b9b}.foto{width:68px;height:68px;object-fit:cover;background:#dcefe3;border-radius:50%;margin:auto;display:flex;align-items:center;justify-content:center;font-size:30px}.nama{font-weight:bold;margin-top:9px;color:#176b45;overflow-wrap:anywhere}.keterangan{font-size:12px;color:#777;margin-top:5px;overflow-wrap:anywhere}.garis{text-align:center;color:#198754;font-size:25px}.kosong{text-align:center;padding:25px;color:#666}footer{text-align:center;padding:20px;color:#888;font-size:12px}</style></head>
<body><header><h2>🌳 Pohon Keluarga Bani Yasroji</h2><p>Hubungan Antar-Generasi</p><a href="index.html" class="kembali">← Kembali ke Beranda</a></header>
<div class="container"><div id="status" class="status">Memuat data keluarga...</div><div id="pohon" class="pohon"></div></div><footer>© 2026 Silsilah Keluarga Bani Yasroji</footer>
<script type="module">
import {db} from "./js/firebase.js";
import {collection,getDocs} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
const status=document.getElementById('status'),pohon=document.getElementById('pohon');
function norm(v){return (v||'').trim().toLocaleLowerCase('id')}
function kartu(a,level){const box=document.createElement('div');box.className='anggota '+(a.jenisKelamin==='Perempuan'?'perempuan':'');const foto=document.createElement('img');foto.className='foto';foto.alt='Foto '+(a.nama||'anggota');foto.src=a.fotoUrl||'';foto.onerror=()=>{const d=document.createElement('div');d.className='foto';d.textContent=a.jenisKelamin==='Perempuan'?'👵':'👤';foto.replaceWith(d)};box.append(foto);const n=document.createElement('div');n.className='nama';n.textContent=a.nama||'Tanpa nama';box.append(n);const k=document.createElement('div');k.className='keterangan';k.textContent=[a.statusHidup||'',a.pasangan?'Pasangan: '+a.pasangan:''].filter(Boolean).join(' • ')||('Generasi '+(level+1));box.append(k);return box}
try{const snap=await getDocs(collection(db,'anggota'));const data=snap.docs.map(d=>({id:d.id,...d.data()}));if(!data.length){status.textContent='Belum ada anggota keluarga yang dimasukkan.';pohon.innerHTML='';}else{status.textContent='Jumlah anggota keluarga: '+data.length;const byName=new Map(data.map(a=>[norm(a.nama),a]));const depth=new Map();function getDepth(a,seen=new Set()){if(depth.has(a.id))return depth.get(a.id);if(seen.has(a.id))return 0;seen.add(a.id);const parents=[byName.get(norm(a.ayah)),byName.get(norm(a.ibu))].filter(Boolean);const val=parents.length?Math.max(...parents.map(p=>getDepth(p,new Set(seen))))+1:0;depth.set(a.id,val);return val}data.forEach(a=>getDepth(a));const levels=[...new Set([...depth.values()])].sort((a,b)=>a-b);levels.forEach((lv,i)=>{const title=document.createElement('h3');title.style.textAlign='center';title.style.color='#176b45';title.textContent='Generasi '+(lv+1);pohon.append(title);const row=document.createElement('div');row.className='generasi';data.filter(a=>depth.get(a.id)===lv).forEach(a=>row.append(kartu(a,lv)));pohon.append(row);if(i<levels.length-1){const arrow=document.createElement('div');arrow.className='garis';arrow.textContent='↓';pohon.append(arrow)}});}}
catch(e){console.error(e);status.textContent='Gagal memuat data. Periksa koneksi internet dan aturan Firestore.'}
</script></body></html>
