<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galeri Keluarga</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f7f3;
    color: #26352b;
}

header {
    background: #176b45;
    color: white;
    text-align: center;
    padding: 22px 15px;
}

header h2 {
    margin: 5px;
}

.kembali {
    color: white;
    text-decoration: none;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 18px;
}

.kotak {
    background: white;
    padding: 18px;
    border-radius: 15px;
    box-shadow: 0 3px 12px #0001;
}

h3 {
    color: #176b45;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin: 8px 0;
}

.galeri {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 20px;
}

.foto {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px #0001;
}

.foto img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    display: block;
}

.keterangan {
    padding: 10px;
}

.keterangan input {
    font-size: 12px;
}

.tombol-hapus {
    width: 100%;
    background: #c0392b;
    color: white;
    border: none;
    padding: 9px;
    border-radius: 7px;
    margin-top: 5px;
}

.kosong {
    text-align: center;
    color: #888;
    padding: 25px 5px;
    grid-column: 1 / -1;
}

footer {
    text-align: center;
    padding: 20px;
    color: #888;
    font-size: 12px;
}

@media (max-width: 350px) {
    .galeri {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h2>📸 Galeri Keluarga</h2>
    <p>Kenangan dan dokumentasi keluarga</p>

    <a href="index.html" class="kembali">
        ← Kembali ke Beranda
    </a>
</header>

<div class="container">

<div class="kotak">

    <h3>Tambah Foto Keluarga</h3>

    <label>Pilih Foto</label>

    <input type="file"
    id="pilihFoto"
    accept="image/*"
    multiple>

    <p style="font-size:12px;color:#888">
        Maksimal 2 MB per foto.
    </p>

</div>

<div class="galeri" id="galeri">

    <div class="kosong">
        📷 Belum ada foto keluarga.
        <br><br>
        Silakan pilih foto dari HP.
    </div>

</div>

</div>

<footer>
© 2026 Silsilah Keluarga
</footer>

<script>

const pilihFoto = document.getElementById("pilihFoto");
const galeri = document.getElementById("galeri");

pilihFoto.addEventListener("change", function() {

    const files = Array.from(this.files);

    files.forEach(file => {

        if (!file.type.startsWith("image/")) {
            return;
        }

        if (file.size > 2 * 1024 * 1024) {
            alert("Foto " + file.name + " melebihi 2 MB.");
            return;
        }

        const url = URL.createObjectURL(file);

        if (galeri.querySelector(".kosong")) {
            galeri.innerHTML = "";
        }

        const kotak = document.createElement("div");
        kotak.className = "foto";

        const gambar = document.createElement("img");
        gambar.src = url;

        const keterangan = document.createElement("div");
        keterangan.className = "keterangan";

        const namaFile = document.createElement("div");
        namaFile.textContent = file.name;
        namaFile.style.fontSize = "12px";
        namaFile.style.color = "#777";

        const input = document.createElement("input");
        input.type = "text";
        input.placeholder = "Foto apa ini? Ceritakan di sini...";

        const hapus = document.createElement("button");
        hapus.className = "tombol-hapus";
        hapus.textContent = "Hapus Foto";

        hapus.onclick = function() {
            URL.revokeObjectURL(url);
            kotak.remove();

            if (galeri.children.length === 0) {
                galeri.innerHTML =
                '<div class="kosong">📷 Belum ada foto keluarga.</div>';
            }
        };

        keterangan.appendChild(namaFile);
        keterangan.appendChild(input);
        keterangan.appendChild(hapus);

        kotak.appendChild(gambar);
        kotak.appendChild(keterangan);

        galeri.appendChild(kotak);

    });

    this.value = "";

});

</script>

</body>
</html>
