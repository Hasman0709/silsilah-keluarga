<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galeri Keluarga Bani Yasroji</title>
  <style>
    *{box-sizing:border-box}
    body{font-family:Arial,sans-serif;margin:0;background:#f3f5f3;color:#222}
    header{background:#176b3a;color:white;text-align:center;padding:22px 14px}
    header h2{margin:0 0 8px}
    header p{margin:0}
    main{max-width:900px;margin:auto;padding:16px}
    .filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
    .filter button{flex:1;min-width:120px;padding:12px;border:0;border-radius:8px;background:#ddd;font-weight:bold}
    .filter button.aktif{background:#176b3a;color:white}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
    .kartu{background:white;border-radius:10px;overflow:hidden;box-shadow:0 2px 6px #0001}
    .kartu img{width:100%;height:155px;object-fit:cover;display:block}
    .isi{padding:10px}
    .isi h3{font-size:16px;margin:0 0 7px}
    .isi p{font-size:13px;color:#555;margin:0;line-height:1.5}
    #pesan{text-align:center;padding:20px;color:#555}
  </style>
</head>
<body><header>
  <h2>Galeri Keluarga Bani Yasroji</h2>
  <p>Dokumentasi dan kenangan keluarga</p>
</header><main>
  <div class="filter">
    <button class="aktif" data-kategori="Semua">Semua Foto</button>
    <button data-kategori="Galeri Foto">Galeri Foto</button>
    <button data-kategori="Galeri Keluarga">Galeri Keluarga</button>
  </div>  <div id="pesan">Memuat galeri...</div>
  <div class="grid" id="galeri"></div>
</main><script type="module">
import { db } from "./js/firebase.js";
import {
  collection, getDocs, query, orderBy
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const galeri = document.getElementById("galeri");
const pesan = document.getElementById("pesan");
let semuaFoto = [];
let kategoriAktif = "Semua";

async function muatGaleri(){
  try{
    const q = query(
      collection(db,"galeri"),
      orderBy("dibuatPada","desc")
    );

    const hasil = await getDocs(q);
    semuaFoto = hasil.docs.map(item => item.data());
    tampilkanFoto();
  }catch(error){
    pesan.textContent = "Gagal memuat galeri: " + error.message;
  }
}

function tampilkanFoto(){
  galeri.innerHTML = "";

  const daftar = kategoriAktif === "Semua"
    ? semuaFoto
    : semuaFoto.filter(foto => foto.kategori === kategoriAktif);

  if(daftar.length === 0){
    pesan.textContent = "Belum ada foto pada kategori ini.";
    return;
  }

  pesan.textContent = "";

  daftar.forEach(foto => {
    const kartu = document.createElement("article");
    kartu.className = "kartu";

    const gambar = document.createElement("img");
    gambar.src = foto.fotoUrl || "";
    gambar.alt = foto.judul || "Foto keluarga";
    gambar.loading = "lazy";

    const isi = document.createElement("div");
    isi.className = "isi";

    const judul = document.createElement("h3");
    judul.textContent = foto.judul || "Tanpa judul";

    const keterangan = document.createElement("p");
    keterangan.textContent = foto.keterangan || "";

    isi.append(judul,keterangan);
    kartu.append(gambar,isi);
    galeri.appendChild(kartu);
  });
}

document.querySelectorAll(".filter button").forEach(tombol => {
  tombol.addEventListener("click", () => {
    document.querySelectorAll(".filter button").forEach(b =>
      b.classList.remove("aktif")
    );

    tombol.classList.add("aktif");
    kategoriAktif = tombol.dataset.kategori;
    tampilkanFoto();
  });
});

muatGaleri();
</script></body>
</html>
