<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kelola Galeri Keluarga</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:16px;color:#222}
    .box{max-width:600px;margin:auto;background:white;padding:18px;border-radius:12px}
    h2{margin-top:0}
    label{display:block;margin-top:14px;font-weight:bold}
    input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:7px;font-size:16px}
    button{background:#176b3a;color:white;border:0;font-weight:bold;cursor:pointer}
    button:disabled{opacity:.6}
    .item{border:1px solid #ddd;padding:12px;margin-top:12px;border-radius:8px}
    .item img{width:100%;max-height:220px;object-fit:cover;border-radius:7px}
    .hapus{background:#b42318}
    #pesan{margin-top:12px;font-weight:bold}
  </style>
</head>
<body>
<div class="box">
  <h2>Kelola Galeri Keluarga</h2>
  <p>Unggah foto keluarga ke galeri Bani Yasroji.</p>  <form id="formGaleri">
    <label>Judul Foto</label>
    <input id="judul" required><label>Kategori</label>
<select id="kategori" required>
  <option value="Galeri Foto">Galeri Foto</option>
  <option value="Galeri Keluarga">Galeri Keluarga</option>
</select>

<label>Keterangan</label>
<textarea id="keterangan" rows="3"></textarea>

<label>Pilih Foto</label>
<input id="foto" type="file" accept="image/*" required>

<button id="tombolSimpan" type="submit">Unggah Foto</button>

  </form>  <div id="pesan"></div>
  <hr>
  <h3>Daftar Foto</h3>
  <div id="daftar">Memuat foto...</div>
</div><script type="module">
import { auth, db } from "./js/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {
  collection, addDoc, getDocs, deleteDoc, doc,
  getDoc, serverTimestamp, query, orderBy
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const WORKER_URL = "https://baniyasroji-upload.hasman0709.workers.dev/";
const ADMIN_DOC = "OTEc6P1dg6cFLoyYtrb3IHNcs413";

const form = document.getElementById("formGaleri");
const pesan = document.getElementById("pesan");
const daftar = document.getElementById("daftar");
const tombol = document.getElementById("tombolSimpan");

let adminAktif = false;

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = "login.html";
    return;
  }

  try {
    const adminRef = doc(db, "admins", user.uid);
    const adminSnap = await getDoc(adminRef);

    if (!adminSnap.exists() || adminSnap.data().role !== "admin") {
      alert("Akses khusus admin.");
      location.href = "index.html";
      return;
    }

    adminAktif = true;
    tampilkanGaleri();
  } catch (error) {
    pesan.textContent = "Gagal memeriksa admin: " + error.message;
  }
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  if (!adminAktif) return;

  const file = document.getElementById("foto").files[0];
  if (!file) {
    pesan.textContent = "Pilih foto terlebih dahulu.";
    return;
  }

  if (!file.type.startsWith("image/")) {
    pesan.textContent = "File harus berupa gambar.";
    return;
  }

  if (file.size > 10 * 1024 * 1024) {
    pesan.textContent = "Ukuran foto maksimal 10 MB.";
    return;
  }

  tombol.disabled = true;
  pesan.textContent = "Sedang mengunggah foto...";

  try {
    const authResponse = await fetch(WORKER_URL, {
      method: "POST"
    });

    const authData = await authResponse.json();

    if (!authResponse.ok) {
      throw new Error(authData.error || "Gagal mendapatkan izin upload.");
    }

    const data = new FormData();
    data.append("file", file);
    data.append("fileName", Date.now() + "-" + file.name);
    data.append("publicKey", authData.publicKey);
    data.append("token", authData.token);
    data.append("expire", authData.expire);
    data.append("signature", authData.signature);
    data.append("folder", "/baniyasroji");

    const uploadResponse = await fetch(
      "https://upload.imagekit.io/api/v1/files/upload",
      { method: "POST", body: data }
    );

    const uploadData = await uploadResponse.json();

    if (!uploadResponse.ok) {
      throw new Error(uploadData.message || "Upload ImageKit gagal.");
    }

    await addDoc(collection(db, "galeri"), {
      judul: document.getElementById("judul").value.trim(),
      kategori: document.getElementById("kategori").value,
      keterangan: document.getElementById("keterangan").value.trim(),
      fotoUrl: uploadData.url,
      fileId: uploadData.fileId,
      filePath: uploadData.filePath,
      dibuatPada: serverTimestamp()
    });

    pesan.textContent = "Foto berhasil diunggah!";
    form.reset();
    await tampilkanGaleri();

  } catch (error) {
    pesan.textContent = "Gagal: " + error.message;
  } finally {
    tombol.disabled = false;
  }
});

async function tampilkanGaleri() {
  daftar.textContent = "Memuat foto...";

  try {
    const q = query(collection(db, "galeri"), orderBy("dibuatPada", "desc"));
    const hasil = await getDocs(q);

    daftar.innerHTML = "";

    if (hasil.empty) {
      daftar.textContent = "Belum ada foto.";
      return;
    }

    hasil.forEach((item) => {
      const data = item.data();
      const kartu = document.createElement("div");
      kartu.className = "item";

      const gambar = document.createElement("img");
      gambar.src = data.fotoUrl || "";
      gambar.alt = data.judul || "Foto keluarga";

      const judul = document.createElement("h3");
      judul.textContent = data.judul || "Tanpa judul";

      const kategori = document.createElement("p");
      kategori.textContent = data.kategori || "";

      const keterangan = document.createElement("p");
      keterangan.textContent = data.keterangan || "";

      const hapus = document.createElement("button");
      hapus.className = "hapus";
      hapus.textContent = "Hapus dari daftar";

      hapus.addEventListener("click", async () => {
        if (!confirm("Hapus foto ini dari daftar galeri?")) return;

        try {
          await deleteDoc(doc(db, "galeri", item.id));
          await tampilkanGaleri();
          pesan.textContent = "Foto dihapus dari daftar galeri.";
        } catch (error) {
          pesan.textContent = "Gagal menghapus: " + error.message;
        }
      });

      kartu.append(gambar, judul, kategori, keterangan, hapus);
      daftar.appendChild(kartu);
    });

  } catch (error) {
    daftar.textContent = "Gagal memuat galeri: " + error.message;
  }
}
</script></body>
</html>
