<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anggota Keluarga Bani Yasroji</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#edf7e9;color:#24452e}
header{background:#08652d;color:white;text-align:center;padding:22px}
header h2{margin:0}
.container{max-width:850px;margin:auto;padding:15px}
.card{background:white;padding:18px;border-radius:15px;margin-bottom:18px;box-shadow:0 3px 12px #0001}
input,select,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{border:0;padding:12px 17px;border-radius:8px;background:#087b35;color:white;font-weight:bold;margin:5px 3px}
.hapus{background:#c62828}
.batal{background:#777}
.item{display:flex;gap:12px;align-items:center;border-bottom:1px solid #ddd;padding:12px 0}
.item img{width:65px;height:65px;object-fit:cover;border-radius:50%;background:#e8f5e9}
.item-info{flex:1;min-width:0}
small{color:#666}
#status{color:#087b35;font-weight:bold}
</style>
</head>
<body>

<header>
<h2>🌳 Data Anggota Keluarga</h2>
<p>Bani Yasroji</p>
<a href="admin.html" style="color:white">← Kembali ke Dashboard</a>
</header>

<div class="container">

<section class="card">
<h3 id="judul">Tambah Anggota Baru</h3>

<form id="form">
<input id="nama" placeholder="Nama lengkap" required>

<select id="jenisKelamin" required>
<option value="">Pilih jenis kelamin</option>
<option value="Laki-laki">Laki-laki</option>
<option value="Perempuan">Perempuan</option>
</select>

<select id="statusHidup">
<option value="Hidup">Hidup</option>
<option value="Meninggal">Meninggal</option>
</select>

<input id="ayah" placeholder="Nama ayah">
<input id="ibu" placeholder="Nama ibu">
<input id="pasangan" placeholder="Nama pasangan">

<label>Foto profil:</label>
<input id="foto" type="file" accept="image/*">
<div id="preview"></div>

<textarea id="catatan" placeholder="Catatan tambahan"></textarea>

<button id="simpan" type="submit">Simpan Anggota</button>
<button id="batal" type="button" class="batal" hidden>Batal Edit</button>
</form>

<p id="status"></p>
</section>

<section class="card">
<h3>Daftar Anggota Keluarga</h3>
<input id="cari" placeholder="Cari nama anggota...">
<div id="daftar">Memuat data...</div>
</section>

</div>

<script type="module">
import {db} from "./js/firebase.js";

import {
collection,addDoc,getDocs,deleteDoc,
doc,updateDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const $=id=>document.getElementById(id);

let semua=[];
let idEdit=null;
let fotoLama="";
let fotoBaru=null;

const form=$("form");

function kompresFoto(file){
return new Promise((resolve,reject)=>{
const reader=new FileReader();

reader.onerror=reject;

reader.onload=()=>{
const img=new Image();

img.onload=()=>{
const canvas=document.createElement("canvas");
const max=400;

let w=img.width;
let h=img.height;

if(w>h && w>max){
h=h*max/w;
w=max;
}else if(h>max){
w=w*max/h;
h=max;
}

canvas.width=w;
canvas.height=h;

canvas.getContext("2d").drawImage(img,0,0,w,h);

resolve(canvas.toDataURL("image/jpeg",0.65));
};

img.onerror=reject;
img.src=reader.result;
};

reader.readAsDataURL(file);
});
}

$("foto").onchange=e=>{
fotoBaru=e.target.files[0]||null;
$("preview").innerHTML="";

if(!fotoBaru)return;

if(!fotoBaru.type.startsWith("image/")){
alert("Pilih file gambar.");
fotoBaru=null;
return;
}

const im=document.createElement("img");
im.src=URL.createObjectURL(fotoBaru);
im.style="width:100px;height:100px;object-fit:cover;border-radius:50%";
$("preview").append(im);
};

async function muat(){
$("daftar").textContent="Memuat data...";

try{
const hasil=await getDocs(collection(db,"anggota"));

semua=hasil.docs.map(d=>({
id:d.id,...d.data()
}));

render(semua);

}catch(e){
console.error(e);
$("daftar").textContent="Gagal memuat data anggota.";
}
}

function render(data){
$("daftar").innerHTML="";

if(!data.length){
$("daftar").textContent="Belum ada anggota.";
return;
}

data.forEach(a=>{
const box=document.createElement("div");
box.className="item";

const im=document.createElement("img");
im.src=a.fotoUrl||"";
im.alt="Foto anggota";

if(!a.fotoUrl){
im.style.display="none";
}

const info=document.createElement("div");
info.className="item-info";

const nama=document.createElement("b");
nama.textContent=a.nama||"Tanpa nama";

const detail=document.createElement("small");
detail.style.display="block";
detail.textContent=
(a.jenisKelamin||"")+" • "+(a.statusHidup||"");

info.append(nama,detail);

const edit=document.createElement("button");
edit.textContent="Edit";
edit.onclick=()=>mulaiEdit(a);

const hapus=document.createElement("button");
hapus.textContent="Hapus";
hapus.className="hapus";
hapus.onclick=()=>hapusAnggota(a);

box.append(im,info,edit, hapus);
$("daftar").append(box);
});
}

function mulaiEdit(a){
idEdit=a.id;
fotoLama=a.fotoUrl||"";
fotoBaru=null;

["nama","jenisKelamin","statusHidup",
"ayah","ibu","pasangan","catatan"].forEach(k=>{
$(k).value=a[k]||"";
});

$("preview").innerHTML="";

if(fotoLama){
const im=document.createElement("img");
im.src=fotoLama;
im.style="width:100px;height:100px;object-fit:cover;border-radius:50%";
$("preview").append(im);
}

$("judul").textContent="Edit Anggota";
$("simpan").textContent="Simpan Perubahan";
$("batal").hidden=false;

window.scrollTo({top:0,behavior:"smooth"});
}

function resetForm(){
form.reset();
idEdit=null;
fotoLama="";
fotoBaru=null;

$("preview").innerHTML="";
$("judul").textContent="Tambah Anggota Baru";
$("simpan").textContent="Simpan Anggota";
$("batal").hidden=true;
}

$("batal").onclick=resetForm;

async function hapusAnggota(a){
if(!confirm("Hapus data "+a.nama+"?"))return;

try{
await deleteDoc(doc(db,"anggota",a.id));
$("status").textContent="Data berhasil dihapus.";
await muat();
}catch(e){
console.error(e);
alert("Gagal menghapus data.");
}
}

form.onsubmit=async e=>{
e.preventDefault();

const btn=$("simpan");
btn.disabled=true;
btn.textContent="Menyimpan...";

try{
let fotoUrl=fotoLama;

if(fotoBaru){
fotoUrl=await kompresFoto(fotoBaru);
}

const data={
nama:$("nama").value.trim(),
jenisKelamin:$("jenisKelamin").value,
statusHidup:$("statusHidup").value,
ayah:$("ayah").value.trim(),
ibu:$("ibu").value.trim(),
pasangan:$("pasangan").value.trim(),
catatan:$("catatan").value.trim(),
fotoUrl,
diperbaruiPada:serverTimestamp()
};

if(idEdit){
await updateDoc(doc(db,"anggota",idEdit),data);
$("status").textContent="Data berhasil diperbarui.";
}else{
data.dibuatPada=serverTimestamp();
await addDoc(collection(db,"anggota"),data);
$("status").textContent="Anggota berhasil ditambahkan.";
}

resetForm();
await muat();

}catch(e){
console.error(e);
$("status").textContent="Gagal menyimpan. Periksa koneksi dan ukuran foto.";
}finally{
btn.disabled=false;
}
};

$("cari").oninput=()=>{
const q=$("cari").value.toLowerCase();

render(semua.filter(a=>
(a.nama||"").toLowerCase().includes(q)
));
};

muat();
</script>
</body>
</html>
