<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anggota Keluarga Bani Yasroji</title><style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7f5;
    color: #26352d;
}

header {
    background: #145c3b;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header h1 {
    font-size: 22px;
    margin-bottom: 7px;
}

header p {
    font-size: 13px;
}

nav {
    background: #10482f;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    padding: 10px;
    gap: 5px;
}

nav a {
    color: white;
    text-decoration: none;
    padding: 10px 13px;
    font-size: 13px;
    border-radius: 5px;
}

nav a:hover {
    background: #28734e;
}

.container {
    width: 92%;
    max-width: 750px;
    margin: 25px auto;
}

.judul {
    color: #145c3b;
    margin-bottom: 15px;
    font-size: 21px;
}

.info {
    background: white;
    padding: 18px;
    border-radius: 10px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px #00000010;
}

.info strong {
    font-size: 25px;
    color: #145c3b;
}

.info p {
    font-size: 13px;
    margin-top: 5px;
}

.pencarian {
    margin-bottom: 18px;
}

.pencarian input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

.pencarian input:focus {
    border-color: #145c3b;
}

.daftar {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px #00000010;
}

.item {
    padding: 15px;
    border-bottom: 1px solid #eeeeee;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.item:last-child {
    border-bottom: none;
}

.nomor {
    background: #e5f2e9;
    color: #145c3b;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
}

.nama {
    font-weight: bold;
}

.pesan {
    text-align: center;
    padding: 25px 12px;
    color: #777;
    font-size: 14px;
}

footer {
    background: #10482f;
    color: white;
    text-align: center;
    padding: 20px 10px;
    margin-top: 40px;
    font-size: 12px;
    line-height: 1.8;
}
</style></head><body><header>
    <h1>ANGGOTA KELUARGA</h1>
    <p>KELUARGA BESAR BANI YASROJI</p>
</header><nav>
    <a href="index.html">Beranda</a>
    <a href="silsilah.html">Pohon Silsilah</a>
    <a href="anggota.html">Anggota Keluarga</a>
    <a href="galeri.html">Galeri Foto</a>
</nav><main class="container"><h2 class="judul">Daftar Seluruh Anggota</h2>

<section class="info">
    <strong id="jumlah">0</strong>
    <p>Jumlah seluruh anggota keluarga</p>
</section>

<section class="pencarian">
    <input
        type="search"
        id="cariNama"
        placeholder="Cari nama anggota keluarga..."
        autocomplete="off"
    >
</section>

<section class="daftar" id="daftarAnggota">
    <div class="pesan">Sedang memuat data anggota...</div>
</section>

</main><footer>
    <strong>KELUARGA BESAR BANI YASROJI</strong><br>
    Menjaga Silsilah, Mempererat Silaturahmi<br>
    &copy; 2026 Bani Yasroji
</footer><script type="module">
import { db } from "./js/firebase.js";

import {
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const daftar = document.getElementById("daftarAnggota");
const jumlah = document.getElementById("jumlah");
const pencarian = document.getElementById("cariNama");

let semuaAnggota = [];

function tampilkanAnggota(data) {
    daftar.innerHTML = "";

    if (data.length === 0) {
        daftar.innerHTML = `
            <div class="pesan">
                Nama anggota tidak ditemukan.
            </div>
        `;
        return;
    }

    data.forEach((anggota, index) => {
        const baris = document.createElement("div");
        baris.className = "item";

        const nomor = document.createElement("span");
        nomor.className = "nomor";
        nomor.textContent = index + 1;

        const nama = document.createElement("span");
        nama.className = "nama";
        nama.textContent = anggota.nama || "Tanpa nama";

        baris.appendChild(nomor);
        baris.appendChild(nama);

        daftar.appendChild(baris);
    });
}

async function muatAnggota() {
    try {
        const snapshot = await getDocs(collection(db, "anggota"));

        semuaAnggota = snapshot.docs
            .map(doc => doc.data())
            .filter(anggota => anggota.nama)
            .sort((a, b) =>
                a.nama.localeCompare(b.nama, "id")
            );

        jumlah.textContent = semuaAnggota.length;

        tampilkanAnggota(semuaAnggota);

    } catch (error) {
        console.error("Gagal memuat anggota:", error);

        daftar.innerHTML = `
            <div class="pesan">
                Data anggota belum dapat ditampilkan.
                Periksa koneksi dan aturan akses Firebase.
            </div>
        `;
    }
}

pencarian.addEventListener("input", function() {
    const kata = this.value.trim().toLowerCase();

    const hasil = semuaAnggota.filter(anggota =>
        anggota.nama.toLowerCase().includes(kata)
    );

    tampilkanAnggota(hasil);
});

muatAnggota();
</script></body>
</html>
