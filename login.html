<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin - Bani Yasroji</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f0f7f2;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    background: white;
    width: 100%;
    max-width: 400px;
    padding: 30px 25px;
    border-radius: 18px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

.logo {
    width: 70px;
    height: 70px;
    background: #e1f3e6;
    color: #168344;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 35px;
    margin: 0 auto 15px;
}

h2 {
    text-align: center;
    color: #176b3a;
}

.keterangan {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin-bottom: 28px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 9px;
    margin-bottom: 18px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #168344;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

button:disabled {
    opacity: 0.6;
}

#pesan {
    text-align: center;
    font-size: 13px;
    margin-top: 15px;
    color: #d9534f;
}

.kembali {
    display: block;
    text-align: center;
    margin-top: 22px;
    color: #168344;
    text-decoration: none;
}

</style>
</head>

<body>

<div class="login-box">

    <div class="logo">🔐</div>

    <h2>Bani Yasroji</h2>

    <p class="keterangan">
        Login khusus pengelola keluarga
    </p>

    <form id="formLogin">

        <label>Email Admin</label>
        <input type="email"
        id="email"
        placeholder="Masukkan email"
        required>

        <label>Kata Sandi</label>
        <input type="password"
        id="password"
        placeholder="Masukkan kata sandi"
        required>

        <button type="submit" id="tombolMasuk">
            MASUK
        </button>

    </form>

    <div id="pesan"></div>

    <a href="index.html" class="kembali">
        ← Kembali ke Halaman Utama
    </a>

</div>

<script type="module">

import { auth } from "./js/firebase.js";

import {
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

const form = document.getElementById("formLogin");
const pesan = document.getElementById("pesan");
const tombol = document.getElementById("tombolMasuk");

form.addEventListener("submit", async function(e) {

    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    tombol.disabled = true;
    tombol.textContent = "MEMERIKSA...";
    pesan.textContent = "";

    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        pesan.style.color = "green";
        pesan.textContent = "Login berhasil. Membuka dashboard...";

        window.location.href = "admin.html";

    } catch (error) {

        pesan.style.color = "red";

        if (
            error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/user-not-found"
        ) {
            pesan.textContent = "Email atau kata sandi salah.";
        } else {
            pesan.textContent = "Login gagal: " + error.message;
        }

        tombol.disabled = false;
        tombol.textContent = "MASUK";

    }

});

</script>

</body>
</html>
