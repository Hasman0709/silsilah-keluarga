<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelola Anggota Keluarga</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#1e293b;
}
header{
  background:#14532d;
  color:white;
  padding:18px;
  text-align:center;
}
.container{
  max-width:900px;
  margin:20px auto;
  padding:15px;
}
.card{
  background:white;
  padding:18px;
  border-radius:12px;
  margin-bottom:18px;
  box-shadow:0 2px 8px #0001;
}
h2{margin-top:0;color:#14532d}
input,select,textarea{
  width:100%;
  padding:12px;
  margin:6px 0 13px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  font-size:15px;
}
label{font-weight:bold;font-size:14px}
button{
  border:0;
  padding:11px 15px;
  border-radius:7px;
  cursor:pointer;
  font-size:14px;
  margin:3px;
}
.simpan{background:#15803d;color:white}
.batal{background:#64748b;color:white}
.edit{background:#2563eb;color:white}
.hapus{background:#dc2626;color:white}
.kembali{background:#e2e8f0;color:#1e293b}
.anggota{
  border:1px solid #e2e8f0;
  padding:12px;
  border-radius:9px;
  margin:10px 0;
  display:flex;
  gap:12px;
  align-items:center;
}
.anggota img{
  width:65px;
  height:65px;
  border-radius:8px;
  object-fit:cover;
  background:#e2e8f0;
}
.info{flex:1;min-width:0}
.info strong{display:block;overflow-wrap:anywhere}
.kecil{font-size:13px;color:#64748b}
#pesan{margin:10px 0;font-weight:bold}
#preview{
  width:100px;
  height:100px;
  object-fit:cover;
  display:none;
  border-radius:8px;
  margin:8px 0;
}
@media(max-width:500px){
  .anggota{align-items:flex-start}
  .anggota img{width:55px;height:55px}
}
</style>
</head>

<body>

<header>
  <h2 style="color:white;margin:0">KELOLA ANGGOTA</h2>
  <p style="margin:7px 0 0">Silsilah Keluarga Bani Yasroji</p>
</header>

<div class="container">

  <div class="card">
    <button class="kembali" onclick="location.href='admin.html'">
      ← Kembali ke Dashboard
    </button>
    <h2 id="judulForm">Tambah Anggota Keluarga</h2>

    <form id="formAnggota">

      <label>Nama Lengkap</label>
      <input id="nama" required>

      <label>Jenis Kelamin</label>
      <select id="jenisKelamin" required>
        <option value="">Pilih jenis kelamin</option>
        <option value="Laki-laki">Laki-laki</option>
        <option value="Perempuan">Perempuan</option>
      </select>

      <label>Status Kehidupan</label>
      <select id="statusHidup">
        <option value="Hidup">Hidup</option>
        <option value="Meninggal">Meninggal</option>
      </select>

      <label>Nama Ayah</label>
      <input id="ayah" placeholder="Kosongkan jika tidak diketahui">

      <label>Nama Ibu</label>
      <input id="ibu" placeholder="Kosongkan jika tidak diketahui">

      <label>Nama Pasangan</label>
      <input id="pasangan" placeholder="Kosongkan jika belum ada">

      <label>Generasi</label>
      <input id="generasi" type="number" min="1" value="1" required>

      <label>Urutan Anak</label>
      <input id="urutan" type="number" min="1" value="1">

      <label>Catatan</label>
      <textarea id="catatan" rows="3"></textarea>

      <label>Foto Anggota</label>
      <input id="foto" type="file" accept="image/*">
      <img id="preview" alt="Pratinjau foto">

      <button class="simpan" type="submit" id="tombolSimpan">
        Simpan Anggota
      </button>

      <button class="batal" type="button" id="tombolBatal" style="display:none">
        Batal Edit
      </button>

    </form>

    <div id="pesan"></div>
  </div>

  <div class="card">
    <h2>Daftar Anggota Keluarga</h2>
    <input id="pencarian" placeholder="Cari nama anggota...">
    <div id="daftar">Memuat data anggota...</div>
  </div>

</div>

<script type="module">
import { auth, db } from "./js/firebase.js";

import {
  collection,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

const koleksi = collection(db, "anggota");

let dataAnggota = [];
let idEdit = null;
let fotoLama = "";

const $ = id => document.getElementById(id);

const pesan = (teks, warna="green") => {
  $("pesan").textContent = teks;
  $("pesan").style.color = warna;
};

// Pemeriksaan admin
onAuthStateChanged(auth, async user => {
  if (!user) {
    location.href = "login.html";
    return;
  }

  try {
    const adminRef = doc(db, "admins", user.uid);
    const adminSnap = await getDoc(adminRef);

    if (!adminSnap.exists() || adminSnap.data().role !== "admin") {
      await signOut(auth);
      location.href = "login.html";
      return;
    }

    muatAnggota();

  } catch (error) {
    pesan("Gagal memeriksa akses admin: " + error.message, "red");
  }
});

// Memuat data
async function muatAnggota() {
  $("daftar").textContent = "Memuat data...";

  try {
    const snapshot = await getDocs(koleksi);

    dataAnggota = snapshot.docs.map(item => ({
      id: item.id,
      ...item.data()
    }));

    tampilkanAnggota();
  } catch (error) {
    $("daftar").textContent = "Gagal memuat data: " + error.message;
  }
}

// Menampilkan daftar
function tampilkanAnggota() {
  const kata = $("pencarian").value.toLowerCase();

  const hasil = dataAnggota.filter(a =>
    (a.nama || "").toLowerCase().includes(kata)
  );

  $("daftar").innerHTML = "";

  if (hasil.length === 0) {
    $("daftar").textContent = "Anggota tidak ditemukan.";
    return;
  }

  hasil.sort((a,b) => (a.nama || "").localeCompare(b.nama || ""));

  hasil.forEach(a => {
    const item = document.createElement("div");
    item.className = "anggota";

    const gambar = document.createElement("img");
    gambar.src = a.fotoUrl || "";
    gambar.alt = "Foto anggota";
    gambar.onerror = () => gambar.style.display = "none";

    const info = document.createElement("div");
    info.className = "info";

    const nama = document.createElement("strong");
    nama.textContent = a.nama || "(Tanpa nama)";

    const detail = document.createElement("div");
    detail.className = "kecil";
    detail.textContent =
      "Generasi " + (a.generasi || "-") +
      " · " + (a.jenisKelamin || "-");

    info.append(nama, detail);

    const tombolEdit = document.createElement("button");
    tombolEdit.className = "edit";
    tombolEdit.textContent = "Edit";
    tombolEdit.onclick = () => mulaiEdit(a.id);

    const tombolHapus = document.createElement("button");
    tombolHapus.className = "hapus";
    tombolHapus.textContent = "Hapus";
    tombolHapus.onclick = () => hapusAnggota(a.id, a.nama);

    item.append(gambar, info, tombolEdit, tombolHapus);
    $("daftar").appendChild(item);
  });
}

$("pencarian").addEventListener("input", tampilkanAnggota);

// Kompres foto menjadi Base64
async function prosesFoto(file) {
  if (!file) return null;

  if (!file.type.startsWith("image/")) {
    throw new Error("File harus berupa gambar.");
  }

  const gambar = new Image();
  const url = URL.createObjectURL(file);

  try {
    await new Promise((resolve, reject) => {
      gambar.onload = resolve;
      gambar.onerror = reject;
      gambar.src = url;
    });

    const batas = 700;
    const skala = Math.min(1, batas / Math.max(gambar.width, gambar.height));

    const canvas = document.createElement("canvas");
    canvas.width = Math.round(gambar.width * skala);
    canvas.height = Math.round(gambar.height * skala);

    const ctx = canvas.getContext("2d");
    ctx.drawImage(gambar, 0, 0, canvas.width, canvas.height);

    return canvas.toDataURL("image/jpeg", 0.7);

  } finally {
    URL.revokeObjectURL(url);
  }
}

// Simpan data
$("formAnggota").addEventListener("submit", async event => {
  event.preventDefault();

  const tombol = $("tombolSimpan");
  tombol.disabled = true;
  pesan("Sedang menyimpan...");

  try {
    const file = $("foto").files[0];
    let fotoUrl = fotoLama;

    if (file) {
      fotoUrl = await prosesFoto(file);
    }

    const data = {
      nama: $("nama").value.trim(),
      jenisKelamin: $("jenisKelamin").value,
      statusHidup: $("statusHidup").value,
      ayah: $("ayah").value.trim(),
      ibu: $("ibu").value.trim(),
      pasangan: $("pasangan").value.trim(),
      generasi: Number($("generasi").value),
      urutan: Number($("urutan").value || 1),
      catatan: $("catatan").value.trim(),
      fotoUrl: fotoUrl || ""
    };

    if (!data.nama) {
      throw new Error("Nama anggota wajib diisi.");
    }

    if (idEdit) {
      await updateDoc(doc(db, "anggota", idEdit), {
        ...data,
        diperbarui: new Date()
      });

      pesan("Data anggota berhasil diperbarui.");
    } else {
      await addDoc(koleksi, {
        ...data,
        dibuat: new Date()
      });

      pesan("Anggota baru berhasil ditambahkan.");
    }

    resetForm();
    await muatAnggota();

  } catch (error) {
    pesan("Gagal menyimpan: " + error.message, "red");
  } finally {
    tombol.disabled = false;
  }
});

// Edit anggota
function mulaiEdit(id) {
  const a = dataAnggota.find(item => item.id === id);
  if (!a) return;

  idEdit = id;
  fotoLama = a.fotoUrl || "";

  $("nama").value = a.nama || "";
  $("jenisKelamin").value = a.jenisKelamin || "";
  $("statusHidup").value = a.statusHidup || "Hidup";
  $("ayah").value = a.ayah || "";
  $("ibu").value = a.ibu || "";
  $("pasangan").value = a.pasangan || "";
  $("generasi").value = a.generasi || 1;
  $("urutan").value = a.urutan || 1;
  $("catatan").value = a.catatan || "";

  $("preview").src = fotoLama;
  $("preview").style.display = fotoLama ? "block" : "none";

  $("judulForm").textContent = "Edit Anggota Keluarga";
  $("tombolSimpan").textContent = "Simpan Perubahan";
  $("tombolBatal").style.display = "inline-block";

  window.scrollTo({top:0, behavior:"smooth"});
}

// Hapus anggota
async function hapusAnggota(id, nama) {
  const yakin = confirm(
    "Apakah Anda yakin ingin menghapus data " + nama + "?"
  );

  if (!yakin) return;

  try {
    await deleteDoc(doc(db, "anggota", id));
    pesan("Data anggota berhasil dihapus.");
    await muatAnggota();
  } catch (error) {
    pesan("Gagal menghapus: " + error.message, "red");
  }
}

// Pratinjau foto
$("foto").addEventListener("change", () => {
  const file = $("foto").files[0];

  if (!file) return;

  $("preview").src = URL.createObjectURL(file);
  $("preview").style.display = "block";
});

// Reset form
function resetForm() {
  $("formAnggota").reset();

  idEdit = null;
  fotoLama = "";

  $("preview").src = "";
  $("preview").style.display = "none";

  $("judulForm").textContent = "Tambah Anggota Keluarga";
  $("tombolSimpan").textContent = "Simpan Anggota";
  $("tombolBatal").style.display = "none";
}

$("tombolBatal").addEventListener("click", resetForm);

</script>
</body>
</html>
