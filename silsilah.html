<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pohon Silsilah Bani Yasroji</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6f4;
  color: #222;
}

header {
  background: #176b45;
  color: white;
  text-align: center;
  padding: 15px;
}

header h2 {
  margin: 0 0 5px;
}

.toolbar {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 10px;
  background: white;
  position: sticky;
  top: 0;
  z-index: 10;
}

.toolbar button {
  background: #176b45;
  color: white;
  border: none;
  border-radius: 7px;
  padding: 10px 17px;
  font-size: 17px;
  font-weight: bold;
}

#status {
  text-align: center;
  padding: 10px;
  font-size: 13px;
}

.area {
  width: 100%;
  height: calc(100vh - 145px);
  overflow: auto;
  padding: 25px;
  touch-action: pan-x pan-y;
}

#ruang {
  width: max-content;
  min-width: 100%;
  display: flex;
  justify-content: center;
}

#pohon {
  width: max-content;
  transform-origin: top center;
}

.keluarga {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: max-content;
  position: relative;
  padding-top: 0;
}

.orangtua {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  position: relative;
  z-index: 2;
}

.kartu {
  width: 125px;
  min-height: 110px;
  padding: 9px 6px;
  background: white;
  border: 2px solid #258457;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 2px 5px #0002;
}

.kartu img {
  width: 55px;
  height: 55px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  margin: 0 auto 6px;
}

.nama {
  font-size: 13px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.label {
  font-size: 11px;
  color: #666;
  margin-top: 5px;
}

.love {
  color: #e53965;
  font-size: 22px;
}

.anak-anak {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: 22px;
  position: relative;
  padding-top: 48px;
  margin-top: 0;
}

.anak-anak::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  height: 24px;
  border-left: 2px solid #80a98e;
}

.anak-anak::after {
  content: "";
  position: absolute;
  top: 24px;
  left: 0;
  right: 0;
  border-top: 2px solid #80a98e;
}

.anak-anak > .keluarga {
  position: relative;
}

.anak-anak > .keluarga::before {
  content: "";
  position: absolute;
  top: -24px;
  height: 24px;
  border-left: 2px solid #80a98e;
}

.pesan {
  text-align: center;
  padding: 25px;
  color: #777;
}

@media(max-width:600px) {
  .area {
    padding: 15px;
  }

  .kartu {
    width: 110px;
    min-height: 105px;
  }

  .anak-anak {
    gap: 14px;
  }
}
</style>
</head>

<body>

<header>
  <h2>🌳 Pohon Silsilah Keluarga</h2>
  <div>Bani Yasroji</div>
</header>

<div class="toolbar">
  <button type="button" onclick="ubahZoom(-0.1)">−</button>
  <button type="button" onclick="resetZoom()">Reset</button>
  <button type="button" onclick="ubahZoom(0.1)">+</button>
  <button type="button" onclick="location.reload()">⟳</button>
</div>

<div id="status">Memuat data keluarga...</div>

<div class="area" id="area">
  <div id="ruang">
    <div id="pohon"></div>
  </div>
</div>

<script type="module">

import { db } from "./js/firebase.js";

import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const pohon = document.getElementById("pohon");
const status = document.getElementById("status");

let anggota = [];
let zoomLevel = 1;

const GENERASI = {
  1: "Kakek / Nenek",
  2: "Anak",
  3: "Cucu",
  4: "Cicit",
  5: "Canggah",
  6: "Wareng"
};

function ubahZoom(nilai) {
  zoomLevel = Math.max(0.25, Math.min(2, zoomLevel + nilai));
  pohon.style.transform = `scale(${zoomLevel})`;
}

function resetZoom() {
  zoomLevel = 1;
  pohon.style.transform = "scale(1)";
}

function normal(teks) {
  return (teks || "").trim().toLowerCase();
}

function cariNama(nama) {
  if (!nama) return null;

  return anggota.find(a =>
    normal(a.nama) === normal(nama)
  ) || null;
}

// Mencari pasangan dari kedua arah.
function cariPasangan(orang) {
  if (!orang) return null;

  return anggota.find(a =>
    normal(a.nama) !== normal(orang.nama) &&
    (
      normal(a.nama) === normal(orang.pasangan) ||
      normal(a.pasangan) === normal(orang.nama)
    )
  ) || null;
}

// Memastikan ayah dan ibu cocok dengan pasangan orang tua.
function cocokOrangtua(anak, ayah, ibu) {

  if (!anak.ayah || !anak.ibu || !ayah || !ibu) {
    return false;
  }

  const namaAyah = normal(anak.ayah);
  const namaIbu = normal(anak.ibu);

  return (
    namaAyah === normal(ayah.nama) &&
    namaIbu === normal(ibu.nama)
  ) || (
    namaAyah === normal(ibu.nama) &&
    namaIbu === normal(ayah.nama)
  );
}

// Mengurutkan anak berdasarkan urutan dalam kelompok orang tua.
function angkaUrutan(teks) {

  const kata = [
    "pertama",
    "kedua",
    "ketiga",
    "keempat",
    "kelima",
    "keenam",
    "ketujuh",
    "kedelapan",
    "kesembilan",
    "kesepuluh"
  ];

  const nilai = normal(teks);

  for (let i = 0; i < kata.length; i++) {
    if (nilai.includes(kata[i])) return i + 1;
  }

  const cocok = nilai.match(/\d+/);

  return cocok ? Number(cocok[0]) : 999;
}

function urutkanAnak(data) {

  return [...data].sort((a, b) => {

    const urutanA = angkaUrutan(a.urutan);
    const urutanB = angkaUrutan(b.urutan);

    if (urutanA !== urutanB) {
      return urutanA - urutanB;
    }

    return (a.nama || "").localeCompare(b.nama || "");
  });
}

function buatKartu(orang, generasi) {

  const kartu = document.createElement("div");
  kartu.className = "kartu";

  if (orang.fotoUrl) {

    const foto = document.createElement("img");
    foto.src = orang.fotoUrl;
    foto.alt = "Foto " + orang.nama;

    kartu.appendChild(foto);
  }

  const nama = document.createElement("div");
  nama.className = "nama";
  nama.textContent = orang.nama || "Tanpa nama";

  const label = document.createElement("div");
  label.className = "label";
  label.textContent =
    orang.urutan || GENERASI[generasi] || "";

  kartu.append(nama, label);

  return kartu;
}

// Membuat satu keluarga dan seluruh keturunannya.
function buatKeluarga(ayah, ibu, generasi, sudahTampil) {

  const keluarga = document.createElement("div");
  keluarga.className = "keluarga";

  const kotakOrangtua = document.createElement("div");
  kotakOrangtua.className = "orangtua";

  kotakOrangtua.appendChild(
    buatKartu(ayah, generasi)
  );

  sudahTampil.add(normal(ayah.nama));

  if (ibu) {

    const love = document.createElement("div");
    love.className = "love";
    love.textContent = "❤️";

    kotakOrangtua.appendChild(love);

    kotakOrangtua.appendChild(
      buatKartu(ibu, generasi)
    );

    sudahTampil.add(normal(ibu.nama));
  }

  keluarga.appendChild(kotakOrangtua);

  // Generasi terakhir tidak perlu mencari keturunan lagi.
  if (generasi >= 6) {
    return keluarga;
  }

  // Cari anak berdasarkan nama ayah dan ibu.
  const anak = anggota.filter(a =>

    Number(a.generasi) === generasi + 1 &&

    cocokOrangtua(a, ayah, ibu) &&

    !sudahTampil.has(normal(a.nama))

  );

  const anakTerurut = urutkanAnak(anak);

  if (anakTerurut.length === 0) {
    return keluarga;
  }

  const wadahAnak = document.createElement("div");
  wadahAnak.className = "anak-anak";

  anakTerurut.forEach(dataAnak => {

    if (sudahTampil.has(normal(dataAnak.nama))) {
      return;
    }

    // Cari pasangan anak.
    let pasangan = cariPasangan(dataAnak);

    // Pasangan hanya ditampilkan jika tercatat di generasi yang sama.
    if (
      pasangan &&
      Number(pasangan.generasi) !== generasi + 1
    ) {
      pasangan = null;
    }

    // Jangan tampilkan pasangan yang sudah dipakai.
    if (
      pasangan &&
      sudahTampil.has(normal(pasangan.nama))
    ) {
      pasangan = null;
    }

    const unitAnak = buatKeluarga(
      dataAnak,
      pasangan,
      generasi + 1,
      sudahTampil
    );

    wadahAnak.appendChild(unitAnak);
  });

  if (wadahAnak.children.length > 0) {
    keluarga.appendChild(wadahAnak);
  }

  return keluarga;
}

async function tampilkanSilsilah() {

  try {

    const hasil = await getDocs(
      collection(db, "anggota")
    );

    anggota = hasil.docs.map(d => ({
      id: d.id,
      ...d.data()
    }));

    pohon.innerHTML = "";

    if (anggota.length === 0) {
      status.textContent = "Belum ada anggota keluarga.";
      return;
    }

    const sudahTampil = new Set();

    // Mencari kakek dan nenek sebagai akar pohon.
    const kakek = anggota.filter(a =>
      Number(a.generasi) === 1 &&
      !a.ayah &&
      !a.ibu &&
      !normal(a.urutan).startsWith("menantu")
    );

    if (kakek.length === 0) {

      status.textContent =
        "Data generasi 1 belum ditemukan. Periksa data Kakek dan Nenek.";

      return;
    }

    // Setiap pasangan generasi 1 menjadi akar keluarga.
    kakek.forEach(orang => {

      if (sudahTampil.has(normal(orang.nama))) {
        return;
      }

      let pasangan = cariPasangan(orang);

      if (
        pasangan &&
        Number(pasangan.generasi) !== 1
      ) {
        pasangan = null;
      }

      if (
        pasangan &&
        sudahTampil.has(normal(pasangan.nama))
      ) {
        pasangan = null;
      }

      const unit = buatKeluarga(
        orang,
        pasangan,
        1,
        sudahTampil
      );

      pohon.appendChild(unit);
    });

    const belumTerhubung = anggota.filter(a =>
      !sudahTampil.has(normal(a.nama))
    );

    status.textContent =
      "Jumlah anggota: " + anggota.length +
      " | Belum terhubung: " + belumTerhubung.length;

  } catch (error) {

    console.error(error);

    status.textContent =
      "Gagal memuat data. Periksa koneksi dan Firebase.";

  }
}

tampilkanSilsilah();

</script>

</body>
</html>
