<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pohon Silsilah Bani Yasroji</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6f4;
  color: #222;
}

header {
  background: #176b45;
  color: white;
  text-align: center;
  padding: 15px;
}

header h2 {
  margin: 0 0 5px;
}

.toolbar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 10px;
  background: white;
  position: sticky;
  top: 0;
  z-index: 10;
}

.toolbar button {
  background: #176b45;
  color: white;
  border: 0;
  border-radius: 7px;
  padding: 10px 17px;
  font-size: 18px;
  font-weight: bold;
}

#status {
  text-align: center;
  padding: 10px;
  font-size: 13px;
}

.area {
  width: 100%;
  height: calc(100vh - 145px);
  overflow: auto;
  background: #f3f6f4;
  touch-action: pan-x pan-y;
}

#ruang {
  width: max-content;
  min-width: 100%;
  padding: 35px;
}

#pohon {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 35px;
  transform-origin: top center;
  width: max-content;
  margin: auto;
}

.unit {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}

.orangtua {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  position: relative;
  z-index: 2;
}

.kartu {
  width: 125px;
  min-height: 115px;
  padding: 9px 6px;
  background: white;
  border: 2px solid #258457;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 2px 5px #0002;
}

.kartu img {
  width: 55px;
  height: 55px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  margin: 0 auto 6px;
}

.nama {
  font-size: 13px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.label {
  font-size: 11px;
  color: #666;
  margin-top: 5px;
}

.love {
  color: #e53965;
  font-size: 22px;
}

.anak-anak {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 20px;
  position: relative;
  padding-top: 48px;
  margin-top: 0;
}

.anak-anak::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  height: 24px;
  border-left: 2px solid #80a98e;
}

.anak-anak::after {
  content: "";
  position: absolute;
  top: 24px;
  left: 0;
  right: 0;
  border-top: 2px solid #80a98e;
}

.anak-anak:has(> .unit:only-child)::after {
  display: none;
}

.anak-anak > .unit {
  position: relative;
}

.anak-anak > .unit::before {
  content: "";
  position: absolute;
  top: -24px;
  height: 24px;
  border-left: 2px solid #80a98e;
}

.kosong {
  text-align: center;
  padding: 30px;
  color: #777;
}

@media(max-width:600px) {
  #ruang {
    padding: 25px;
  }

  .kartu {
    width: 110px;
    min-height: 108px;
  }

  .anak-anak {
    gap: 12px;
  }
}
</style>
</head>

<body>

<header>
  <h2>🌳 Pohon Silsilah Keluarga</h2>
  <div>Bani Yasroji</div>
</header>

<div class="toolbar">
  <button type="button" onclick="zoom(-0.1)">−</button>
  <button type="button" onclick="resetZoom()">Reset</button>
  <button type="button" onclick="zoom(0.1)">+</button>
  <button type="button" onclick="location.reload()">⟳</button>
</div>

<div id="status">Memuat data keluarga...</div>

<div class="area" id="area">
  <div id="ruang">
    <div id="pohon"></div>
  </div>
</div>

<script type="module">

import { db } from "./js/firebase.js";

import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const pohon = document.getElementById("pohon");
const status = document.getElementById("status");

let anggota = [];
let zoomLevel = 1;

function zoom(nilai) {
  zoomLevel = Math.max(0.3, Math.min(2, zoomLevel + nilai));
  pohon.style.transform = `scale(${zoomLevel})`;
}

function resetZoom() {
  zoomLevel = 1;
  pohon.style.transform = "scale(1)";
}

function normal(teks) {
  return (teks || "").trim().toLowerCase();
}

function cariNama(nama) {
  return anggota.find(a =>
    normal(a.nama) === normal(nama)
  ) || null;
}

function cariPasangan(orang) {

  if (!orang) return null;

  // Cari berdasarkan kolom pasangan.
  let pasangan = cariNama(orang.pasangan);

  if (pasangan && normal(pasangan.nama) !== normal(orang.nama)) {
    return pasangan;
  }

  // Periksa juga hubungan pasangan dari arah sebaliknya.
  return anggota.find(a =>
    normal(a.nama) !== normal(orang.nama) &&
    normal(a.pasangan) === normal(orang.nama)
  ) || null;
}

function buatKartu(orang, label) {

  const kartu = document.createElement("div");
  kartu.className = "kartu";

  if (orang.fotoUrl) {
    const foto = document.createElement("img");
    foto.src = orang.fotoUrl;
    foto.alt = "Foto " + orang.nama;
    kartu.appendChild(foto);
  }

  const nama = document.createElement("div");
  nama.className = "nama";
  nama.textContent = orang.nama || "Tanpa nama";

  const keterangan = document.createElement("div");
  keterangan.className = "label";
  keterangan.textContent = label || "";

  kartu.append(nama, keterangan);

  return kartu;
}

function labelOrang(orang, generasi) {

  if (orang.urutan) return orang.urutan;

  const label = {
    1: "Kakek / Nenek",
    2: "Anak",
    3: "Cucu",
    4: "Cicit",
    5: "Canggah",
    6: "Wareng"
  };

  return label[generasi] || "";
}

function cocokOrangtua(anak, ayah, ibu) {

  const namaAyah = normal(anak.ayah);
  const namaIbu = normal(anak.ibu);

  const nama1 = normal(ayah?.nama);
  const nama2 = normal(ibu?.nama);

  if (!namaAyah && !namaIbu) return false;

  // Nama ayah dan ibu harus cocok dengan pasangan orang tua.
  return (
    namaAyah === nama1 &&
    namaIbu === nama2
  ) || (
    namaAyah === nama2 &&
    namaIbu === nama1
  );
}

function buatUnit(orang, generasi, sudahTampil, jalur) {

  if (!orang || sudahTampil.has(normal(orang.nama))) {
    return null;
  }

  const unit = document.createElement("div");
  unit.className = "unit";

  let pasangan = cariPasangan(orang);

  // Jangan memasangkan anggota yang sudah dipakai.
  if (
    pasangan &&
    (
      sudahTampil.has(normal(pasangan.nama)) ||
      Number(pasangan.generasi) !== generasi
    )
  ) {
    pasangan = null;
  }

  let ayah = orang;
  let ibu = pasangan;

  // Anak/keturunan ditampilkan di kiri dan menantu di kanan.
  if (
    normal(orang.urutan).startsWith("menantu") &&
    pasangan &&
    !normal(pasangan.urutan).startsWith("menantu")
  ) {
    ayah = pasangan;
    ibu = orang;
  }

  const kotakOrangtua = document.createElement("div");
  kotakOrangtua.className = "orangtua";

  kotakOrangtua.appendChild(
    buatKartu(ayah, labelOrang(ayah, generasi))
  );

  sudahTampil.add(normal(ayah.nama));

  if (ibu) {

    const love = document.createElement("div");
    love.className = "love";
    love.textContent = "❤️";

    kotakOrangtua.appendChild(love);

    kotakOrangtua.appendChild(
      buatKartu(ibu, labelOrang(ibu, generasi))
    );

    sudahTampil.add(normal(ibu.nama));
  }

  unit.appendChild(kotakOrangtua);

  // Cari anak berdasarkan nama ayah dan ibu.
  if (generasi < 6) {

    const anak = anggota.filter(a =>
      Number(a.generasi) === generasi + 1 &&
      cocokOrangtua(a, ayah, ibu) &&
      !sudahTampil.has(normal(a.nama))
    );

    if (anak.length > 0) {

      const wadahAnak = document.createElement("div");
      wadahAnak.className = "anak-anak";

      anak.sort((a, b) =>
        (a.urutan || "").localeCompare(b.urutan || "")
      );

      anak.forEach(dataAnak => {

        if (sudahTampil.has(normal(dataAnak.nama))) return;

        const unitAnak = buatUnit(
          dataAnak,
          generasi + 1,
          sudahTampil,
          jalur
        );

        if (unitAnak) {
          wadahAnak.appendChild(unitAnak);
        }
      });

      if (wadahAnak.children.length > 0) {
        unit.appendChild(wadahAnak);
      }
    }
  }

  return unit;
}

async function tampilkanSilsilah() {

  try {

    const hasil = await getDocs(collection(db, "anggota"));

    anggota = hasil.docs.map(d => ({
      id: d.id,
      ...d.data()
    }));

    pohon.innerHTML = "";

    if (anggota.length === 0) {
      status.textContent = "Belum ada anggota keluarga.";
      return;
    }

    const sudahTampil = new Set();

    // Akar pohon adalah anggota generasi 1.
    const akar = anggota.filter(a =>
      Number(a.generasi) === 1 &&
      !a.ayah &&
      !a.ibu &&
      !normal(a.urutan).startsWith("menantu")
    );

    akar.forEach(orang => {

      if (sudahTampil.has(normal(orang.nama))) return;

      const unit = buatUnit(
        orang,
        1,
        sudahTampil,
        []
      );

      if (unit) {
        pohon.appendChild(unit);
      }
    });

    // Anggota yang belum terhubung ke orang tua ditampilkan terpisah.
    const belumTerhubung = anggota.filter(a =>
      !sudahTampil.has(normal(a.nama))
    );

    if (belumTerhubung.length > 0) {

      const bagian = document.createElement("div");
      bagian.style.marginTop = "40px";
      bagian.style.textAlign = "center";

      const judul = document.createElement("h3");
      judul.textContent = "Anggota belum terhubung";

      bagian.appendChild(judul);

      belumTerhubung.forEach(a => {

        const kartu = buatKartu(
          a,
          "Generasi " + (a.generasi || "belum diisi")
        );

        kartu.style.display = "inline-block";
        kartu.style.margin = "8px";

        bagian.appendChild(kartu);
      });

      pohon.appendChild(bagian);
    }

    status.textContent =
      "Jumlah anggota keluarga: " + anggota.length;

  } catch (error) {

    console.error(error);

    status.textContent =
      "Gagal memuat data. Periksa koneksi Firebase.";

  }
}

tampilkanSilsilah();

</script>

</body>
</html>
