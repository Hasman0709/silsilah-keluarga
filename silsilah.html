<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pohon Silsilah Bani Yasroji</title><style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#edf5ed;
  color:#23432d;
}

header{
  background:#08712f;
  color:white;
  text-align:center;
  padding:18px 10px;
}

header h2{margin:5px}
header a{color:white;text-decoration:none}

.toolbar{
  background:white;
  padding:10px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 5px #0002;
}

button{
  border:0;
  background:#087b35;
  color:white;
  padding:10px 13px;
  border-radius:8px;
  margin:3px;
  font-size:14px;
}

.petunjuk{
  font-size:12px;
  color:#666;
  margin:8px;
}

#status{
  font-size:13px;
  color:#08712f;
  margin:8px;
}

.area{
  width:100%;
  height:72vh;
  overflow:auto;
  background:#f5f9f3;
  border-top:1px solid #ddd;
  overscroll-behavior:contain;
  touch-action:pan-x pan-y;
}

.pohon{
  display:flex;
  align-items:flex-start;
  justify-content:center;
  width:max-content;
  min-width:100%;
  padding:35px;
}

.keluarga{
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  flex-shrink:0;
  padding:0 12px;
}

.pasangan{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  position:relative;
  z-index:2;
}

.kartu{
  width:135px;
  min-height:145px;
  background:white;
  border:2px solid #168443;
  border-radius:12px;
  padding:9px 6px;
  text-align:center;
  box-shadow:0 2px 6px #0002;
  flex-shrink:0;
}

.kartu img,.avatar{
  width:62px;
  height:62px;
  border-radius:50%;
  object-fit:cover;
  margin:auto;
}

.avatar{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  background:#e4f2e5;
}

.nama{
  font-size:13px;
  font-weight:bold;
  margin-top:7px;
  overflow-wrap:anywhere;
}

.urutan{
  color:#08712f;
  font-size:12px;
  font-weight:bold;
  margin-top:5px;
}

.info{
  color:#777;
  font-size:11px;
  margin-top:5px;
}

.hati{
  color:#d52e52;
  font-size:20px;
  flex-shrink:0;
}

.garis-turun{
  width:2px;
  height:28px;
  background:#168443;
}

.anak-anak{
  display:flex;
  align-items:flex-start;
  justify-content:center;
  position:relative;
  gap:0;
  padding-top:28px;
}

/* Garis horizontal mengikuti lebar seluruh anak */
.anak-anak:before{
  content:"";
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 135px);
  height:2px;
  background:#168443;
}

.anak{
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  padding:0 8px;
  flex-shrink:0;
}

/* Garis dari garis horizontal ke setiap anak */
.anak:before{
  content:"";
  position:absolute;
  top:-28px;
  left:50%;
  transform:translateX(-50%);
  width:2px;
  height:28px;
  background:#168443;
}

#belum{
  background:white;
  margin:12px;
  padding:15px;
  border-radius:10px;
}

#belum p{
  border-bottom:1px solid #ddd;
  padding:6px;
  font-size:13px;
}

.kosong{
  padding:25px;
  color:#777;
}

@media(max-width:600px){
  .pohon{padding:25px}
  .kartu{width:125px}
  .anak{padding-left:5px;padding-right:5px}
}
</style></head><body><header>
  <h2>🌳 POHON SILSILAH KELUARGA</h2>
  <h3>BANI YASROJI</h3>
  <a href="index.html">← Halaman Utama</a>
</header><div class="toolbar">
  <button onclick="muatData()">🔄 Perbarui</button>
  <button onclick="geser(-300,0)">◀ Kiri</button>
  <button onclick="geser(300,0)">Kanan ▶</button>
  <button onclick="geser(0,-250)">▲ Atas</button>
  <button onclick="geser(0,250)">▼ Bawah</button>  <div class="petunjuk">
    Geser bagan dengan jari ke segala arah.
  </div>  <div id="status">Memuat data keluarga...</div>
</div><div class="area" id="area">
  <div class="pohon" id="pohon">
    Memuat pohon keluarga...
  </div>
</div><div id="belum">
  <h3>Anggota Belum Terhubung</h3>
  <div id="daftarBelum"></div>
</div><script type="module">

import {db} from "./js/firebase.js";

import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const area=document.getElementById("area");
const pohon=document.getElementById("pohon");
const status=document.getElementById("status");
const daftarBelum=document.getElementById("daftarBelum");

let anggota=[];

function normal(teks){
  return (teks||"").trim().toLowerCase();
}

function sama(a,b){
  return normal(a)!=="" && normal(a)===normal(b);
}

function angkaUrutan(teks){
  const daftar=[
    "pertama","kedua","ketiga","keempat","kelima",
    "keenam","ketujuh","kedelapan","kesembilan","kesepuluh"
  ];

  const kata=normal(teks).split(/\s+/);

  for(let i=0;i<daftar.length;i++){
    if(kata.includes(daftar[i]))return i+1;
  }

  return 999;
}

function urutkan(data){
  return [...data].sort((a,b)=>{
    return angkaUrutan(a.urutan)-angkaUrutan(b.urutan);
  });
}

function cariPasangan(orang){
  if(!orang.pasangan)return null;

  return anggota.find(a=>
    a.id!==orang.id &&
    sama(a.nama,orang.pasangan)
  )||null;
}

function cariAnak(p1,p2){
  const nama1=p1?.nama||"";
  const nama2=p2?.nama||"";

  return urutkan(anggota.filter(a=>{
    const cocokAyah=
      sama(a.ayah,nama1)||sama(a.ayah,nama2);

    const cocokIbu=
      sama(a.ibu,nama1)||sama(a.ibu,nama2);

    return cocokAyah||cocokIbu;
  }));
}

function buatAvatar(a){
  const avatar=document.createElement("div");
  avatar.className="avatar";
  avatar.textContent=
    a.jenisKelamin==="Perempuan"?"👩":"👨";
  return avatar;
}

function buatKartu(a){
  const kartu=document.createElement("div");
  kartu.className="kartu";

  if(a.fotoUrl){
    const img=document.createElement("img");
    img.src=a.fotoUrl;
    img.alt=a.nama||"Foto";
    img.onerror=()=>img.replaceWith(buatAvatar(a));
    kartu.appendChild(img);
  }else{
    kartu.appendChild(buatAvatar(a));
  }

  const nama=document.createElement("div");
  nama.className="nama";
  nama.textContent=a.nama||"-";

  const urutan=document.createElement("div");
  urutan.className="urutan";
  urutan.textContent=a.urutan||"";

  const info=document.createElement("div");
  info.className="info";
  info.textContent=a.statusHidup||"";

  kartu.append(nama,urutan,info);

  return kartu;
}

function buatPasangan(p1,p2){
  const box=document.createElement("div");
  box.className="pasangan";

  box.appendChild(buatKartu(p1));

  if(p2){
    const hati=document.createElement("div");
    hati.className="hati";
    hati.textContent="♥";

    box.append(hati,buatKartu(p2));
  }

  return box;
}

/*
  Setiap pasangan menjadi satu kelompok keluarga.
  Anggota yang sudah ditampilkan tidak dibuat ulang.
*/

function buatKeluarga(p1,p2,ditampilkan,tingkat=0){

  const kelompok=document.createElement("div");
  kelompok.className="keluarga";

  kelompok.appendChild(buatPasangan(p1,p2));

  ditampilkan.add(p1.id);
  if(p2)ditampilkan.add(p2.id);

  if(tingkat>=20)return kelompok;

  const anak=cariAnak(p1,p2).filter(a=>
    !ditampilkan.has(a.id)
  );

  if(!anak.length)return kelompok;

  const garis=document.createElement("div");
  garis.className="garis-turun";
  kelompok.appendChild(garis);

  const anakArea=document.createElement("div");
  anakArea.className="anak-anak";

  anak.forEach(a=>{

    if(ditampilkan.has(a.id))return;

    const pasangan=cariPasangan(a);

    /*
      Jangan tampilkan pasangan dua kali.
      Jika pasangan sudah muncul pada cabang lain,
      tampilkan anggota ini tanpa kartu pasangan.
    */

    const pasanganAman=
      pasangan && !ditampilkan.has(pasangan.id)
      ?pasangan:null;

    const item=document.createElement("div");
    item.className="anak";

    item.appendChild(
      buatKeluarga(
        a,
        pasanganAman,
        ditampilkan,
        tingkat+1
      )
    );

    anakArea.appendChild(item);

  });

  if(anakArea.children.length){
    kelompok.appendChild(anakArea);
  }

  return kelompok;
}

function render(){

  pohon.innerHTML="";
  daftarBelum.innerHTML="";

  if(!anggota.length){
    pohon.textContent="Belum ada anggota keluarga.";
    return;
  }

  const ditampilkan=new Set();

  /*
    Akar adalah anggota yang ayah dan ibunya
    tidak ditemukan sebagai anggota lain.
  */

  const akar=anggota.filter(a=>{

    const ayahAda=anggota.some(b=>
      b.id!==a.id && sama(a.ayah,b.nama)
    );

    const ibuAda=anggota.some(b=>
      b.id!==a.id && sama(a.ibu,b.nama)
    );

    return !ayahAda&&!ibuAda;
  });

  const akarUrut=urutkan(akar);

  akarUrut.forEach(a=>{

    if(ditampilkan.has(a.id))return;

    const pasangan=cariPasangan(a);

    const pasanganAman=
      pasangan&&!ditampilkan.has(pasangan.id)
      ?pasangan:null;

    pohon.appendChild(
      buatKeluarga(a,pasanganAman,ditampilkan)
    );

  });

  const belum=anggota.filter(a=>
    !ditampilkan.has(a.id)
  );

  if(!belum.length){
    daftarBelum.textContent=
      "Semua anggota sudah ditampilkan.";
  }else{
    belum.forEach(a=>{
      const p=document.createElement("p");
      p.textContent=
        a.nama+" — "+(a.urutan||"Urutan belum diisi");
      daftarBelum.appendChild(p);
    });
  }
}

async function muatData(){

  status.textContent="Mengambil data keluarga...";
  pohon.textContent="Memuat...";

  try{

    const hasil=await getDocs(collection(db,"anggota"));

    anggota=hasil.docs.map(d=>({
      id:d.id,
      ...d.data()
    }));

    render();

    status.textContent=
      "Berhasil memuat "+anggota.length+
      " anggota keluarga.";

  }catch(e){

    console.error(e);

    status.textContent=
      "Gagal memuat data. Periksa koneksi dan Firestore.";

    pohon.textContent="Data tidak dapat dimuat.";
  }
}

window.muatData=muatData;

window.geser=(x,y)=>{
  area.scrollBy({
    left:x,
    top:y,
    behavior:"smooth"
  });
};

muatData();

</script></body>
</html>
