<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pohon Silsilah Bani Yasroji</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#edf5ed;
  color:#23432d;
}

header{
  background:#08712f;
  color:white;
  text-align:center;
  padding:18px 10px;
}

header h2{margin:5px}

header a{
  color:white;
  text-decoration:none;
}

.toolbar{
  background:white;
  padding:12px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 5px #0002;
}

button{
  border:0;
  background:#087b35;
  color:white;
  padding:10px 15px;
  border-radius:8px;
  margin:3px;
  font-size:14px;
}

.petunjuk{
  font-size:12px;
  color:#666;
  margin:8px;
}

#status{
  font-size:13px;
  color:#08712f;
  margin:8px;
}

.area{
  width:100%;
  height:75vh;
  overflow:auto;
  background:#f5f9f3;
  border-top:1px solid #ddd;
  touch-action:pan-x pan-y;
  overscroll-behavior:contain;
}

.pohon{
  display:flex;
  align-items:flex-start;
  justify-content:center;
  width:max-content;
  min-width:100%;
  padding:35px;
}

.kelompok{
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  padding:0 15px;
}

.pasangan{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  position:relative;
}

.kartu{
  width:145px;
  min-height:155px;
  background:white;
  border:2px solid #168443;
  border-radius:12px;
  padding:10px 7px;
  text-align:center;
  box-shadow:0 2px 7px #0002;
}

.kartu img,
.avatar{
  width:65px;
  height:65px;
  border-radius:50%;
  object-fit:cover;
  margin:auto;
}

.avatar{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  background:#e4f2e5;
}

.nama{
  font-size:13px;
  font-weight:bold;
  margin-top:7px;
  overflow-wrap:anywhere;
}

.urutan{
  color:#08712f;
  font-size:12px;
  font-weight:bold;
  margin-top:5px;
}

.info{
  color:#777;
  font-size:11px;
  margin-top:5px;
}

.hati{
  color:#d52e52;
  font-size:20px;
  padding:2px;
}

.garis-vertikal{
  width:2px;
  height:30px;
  background:#168443;
}

.anak-area{
  display:flex;
  align-items:flex-start;
  justify-content:center;
  position:relative;
  padding-top:0;
  gap:12px;
}

.anak-area:before{
  content:"";
  position:absolute;
  top:0;
  left:50%;
  height:2px;
  width:calc(100% - 145px);
  background:#168443;
  transform:translateX(-50%);
}

.anak-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  padding-top:0;
}

.anak-item:before{
  content:"";
  width:2px;
  height:25px;
  background:#168443;
}

.kosong{
  padding:25px;
  color:#777;
}

#belum{
  background:white;
  margin:12px;
  padding:15px;
  border-radius:10px;
}

#belum p{
  border-bottom:1px solid #ddd;
  padding:6px;
  font-size:13px;
}

@media(max-width:600px){
  .pohon{padding:25px}
  .kartu{width:130px}
}
</style>
</head>

<body>

<header>
  <h2>🌳 POHON SILSILAH KELUARGA</h2>
  <h3>BANI YASROJI</h3>
  <a href="index.html">← Halaman Utama</a>
</header>

<div class="toolbar">
  <button onclick="muatData()">🔄 Perbarui</button>
  <button onclick="geserKiri()">◀ Kiri</button>
  <button onclick="geserKanan()">Kanan ▶</button>
  <button onclick="geserAtas()">▲ Atas</button>
  <button onclick="geserBawah()">▼ Bawah</button>

  <div class="petunjuk">
    Geser bagan dengan jari ke kiri, kanan, atas, atau bawah.
  </div>

  <div id="status">Memuat data keluarga...</div>
</div>

<div class="area" id="area">
  <div class="pohon" id="pohon">
    Memuat pohon keluarga...
  </div>
</div>

<div id="belum">
  <h3>Anggota Belum Terhubung</h3>
  <div id="daftarBelum"></div>
</div>

<script type="module">

import {db} from "./js/firebase.js";

import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const area=document.getElementById("area");
const pohon=document.getElementById("pohon");
const status=document.getElementById("status");
const daftarBelum=document.getElementById("daftarBelum");

let anggota=[];

function namaSama(a,b){
  return (a||"").trim().toLowerCase()===
         (b||"").trim().toLowerCase();
}

function urutanAngka(teks){

  const angka={
    pertama:1,
    kedua:2,
    ketiga:3,
    keempat:4,
    kelima:5,
    keenam:6,
    ketujuh:7,
    kedelapan:8,
    kesembilan:9,
    kesepuluh:10
  };

  const kata=(teks||"").toLowerCase().split(" ");

  for(const k of kata){
    if(angka[k])return angka[k];
  }

  return 999;
}

function urutkan(data){

  return [...data].sort((a,b)=>{

    return urutanAngka(a.urutan)-
           urutanAngka(b.urutan);

  });

}

function cariPasangan(orang){

  if(!orang.pasangan)return null;

  return anggota.find(a=>
    a.id!==orang.id &&
    namaSama(a.nama,orang.pasangan)
  )||null;

}

function cariAnak(p1,p2){

  const nama1=p1?.nama||"";
  const nama2=p2?.nama||"";

  return urutkan(anggota.filter(a=>{

    const ayah=namaSama(a.ayah,nama1) ||
               (nama2 && namaSama(a.ayah,nama2));

    const ibu=namaSama(a.ibu,nama1) ||
              (nama2 && namaSama(a.ibu,nama2));

    return ayah||ibu;

  }));

}

function buatKartu(a){

  const kartu=document.createElement("div");
  kartu.className="kartu";

  if(a.fotoUrl){

    const img=document.createElement("img");
    img.src=a.fotoUrl;
    img.alt=a.nama||"Foto";

    img.onerror=()=>{
      img.replaceWith(buatAvatar(a));
    };

    kartu.appendChild(img);

  }else{

    kartu.appendChild(buatAvatar(a));

  }

  const nama=document.createElement("div");
  nama.className="nama";
  nama.textContent=a.nama||"-";

  const urutan=document.createElement("div");
  urutan.className="urutan";
  urutan.textContent=a.urutan||"";

  const info=document.createElement("div");
  info.className="info";
  info.textContent=a.statusHidup||"";

  kartu.append(nama,urutan,info);

  return kartu;

}

function buatAvatar(a){

  const av=document.createElement("div");
  av.className="avatar";

  av.textContent=
    a.jenisKelamin==="Perempuan"?"👩":"👨";

  return av;

}

function buatPasangan(p1,p2){

  const box=document.createElement("div");
  box.className="pasangan";

  box.appendChild(buatKartu(p1));

  if(p2){

    const hati=document.createElement("div");
    hati.className="hati";
    hati.textContent="♥";

    box.append(hati,buatKartu(p2));

  }

  return box;

}

function buatKeluarga(p1,p2,tingkat=0,jalur=[]){

  const kelompok=document.createElement("div");
  kelompok.className="kelompok";

  kelompok.appendChild(buatPasangan(p1,p2));

  const pasanganId=p2?.id||"";

  const kunci=p1.id+"|"+pasanganId;

  if(jalur.includes(kunci))return kelompok;

  if(tingkat>=20)return kelompok;

  const anak=cariAnak(p1,p2);

  if(!anak.length)return kelompok;

  const garis=document.createElement("div");
  garis.className="garis-vertikal";

  kelompok.appendChild(garis);

  const areaAnak=document.createElement("div");
  areaAnak.className="anak-area";

  const sudah=new Set();

  anak.forEach(a=>{

    if(sudah.has(a.id))return;

    sudah.add(a.id);

    const pasanganAnak=cariPasangan(a);

    if(pasanganAnak){
      sudah.add(pasanganAnak.id);
    }

    const item=document.createElement("div");
    item.className="anak-item";

    item.appendChild(
      buatKeluarga(
        a,
        pasanganAnak,
        tingkat+1,
        [...jalur,kunci]
      )
    );

    areaAnak.appendChild(item);

  });

  kelompok.appendChild(areaAnak);

  return kelompok;

}

function render(){

  pohon.innerHTML="";
  daftarBelum.innerHTML="";

  if(!anggota.length){

    pohon.textContent="Belum ada data anggota keluarga.";
    return;

  }

  const sudahDipakai=new Set();

  const akar=anggota.filter(a=>{

    const punyaOrangTua=
      anggota.some(b=>
        b.id!==a.id &&
        (
          namaSama(a.ayah,b.nama)||
          namaSama(a.ibu,b.nama)
        )
      );

    return !punyaOrangTua;

  });

  const akarBelum=[];

  akar.forEach(a=>{

    if(sudahDipakai.has(a.id))return;

    const pasangan=cariPasangan(a);

    if(pasangan && sudahDipakai.has(pasangan.id))return;

    sudahDipakai.add(a.id);

    if(pasangan)sudahDipakai.add(pasangan.id);

    const keluarga=buatKeluarga(a,pasangan);

    pohon.appendChild(keluarga);

  });

  const semuaTerhubung=new Set();

  function tandai(p1,p2,jalur=[]){

    const key=p1.id+"|"+(p2?.id||"");

    if(jalur.includes(key))return;

    semuaTerhubung.add(p1.id);

    if(p2)semuaTerhubung.add(p2.id);

    cariAnak(p1,p2).forEach(a=>{

      const pasangan=cariPasangan(a);

      tandai(a,pasangan,[...jalur,key]);

    });

  }

  akar.forEach(a=>{

    const pasangan=cariPasangan(a);

    tandai(a,pasangan);

  });

  const belum=anggota.filter(a=>
    !semuaTerhubung.has(a.id)
  );

  if(!belum.length){

    daftarBelum.textContent="Semua anggota sudah terhubung.";

  }else{

    belum.forEach(a=>{

      const p=document.createElement("p");

      p.textContent=
        a.nama+" — "+(a.urutan||"Urutan belum diisi");

      daftarBelum.appendChild(p);

    });

  }

}

async function muatData(){

  status.textContent="Mengambil data keluarga...";

  pohon.textContent="Memuat...";

  try{

    const hasil=await getDocs(
      collection(db,"anggota")
    );

    anggota=hasil.docs.map(d=>({
      id:d.id,
      ...d.data()
    }));

    render();

    status.textContent=
      "Berhasil memuat "+anggota.length+
      " anggota keluarga.";

  }catch(e){

    console.error(e);

    status.textContent=
      "Gagal memuat data. Periksa koneksi dan Firestore.";

    pohon.textContent="Data tidak dapat dimuat.";

  }

}

window.muatData=muatData;

window.geserKiri=()=>{
  area.scrollBy({left:-300,behavior:"smooth"});
};

window.geserKanan=()=>{
  area.scrollBy({left:300,behavior:"smooth"});
};

window.geserAtas=()=>{
  area.scrollBy({top:-250,behavior:"smooth"});
};

window.geserBawah=()=>{
  area.scrollBy({top:250,behavior:"smooth"});
};

muatData();

</script>

</body>
</html>
