<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pohon Keluarga Bani Yasroji</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f7f3;color:#26352b}
header{background:#176b45;color:white;padding:18px 12px;text-align:center}
header h2{margin:4px;font-size:21px}
header p{margin:7px 0}
.kembali{color:white;display:inline-block;margin-top:8px}
.container{padding:14px 10px}
.status{background:white;padding:13px;border-radius:12px;margin:8px auto 14px;max-width:700px;text-align:center;box-shadow:0 2px 8px #0001}
.toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px}
.toolbar button{border:0;border-radius:20px;padding:9px 15px;background:#176b45;color:white;font-weight:bold}
.petunjuk{text-align:center;color:#66766b;font-size:12px;margin:8px}
.pohon{position:relative;overflow:auto;padding:12px 10px 35px;min-height:120px}
.lapisan{position:relative;z-index:2;display:flex;justify-content:center;align-items:stretch;gap:18px;width:max-content;min-width:100%;margin:0 auto 22px}
.kolom{display:flex;flex-direction:row;align-items:center;gap:8px}
.pasangan-label{font-size:10px;font-weight:bold;color:#9a6b18;text-align:center;max-width:62px;line-height:1.3}
.judul{font-weight:bold;color:#176b45;text-align:center;margin:12px 0 10px}
.anggota{width:158px;background:white;padding:11px 9px;border-radius:14px;box-shadow:0 3px 10px #0002;border-top:4px solid #198754;text-align:center;position:relative}
.anggota.perempuan{border-top-color:#bd6b9b}
.foto{width:66px;height:66px;object-fit:cover;background:#e3f1e7;border-radius:50%;display:block;margin:auto}
.avatar{width:66px;height:66px;border-radius:50%;background:#e3f1e7;display:grid;place-items:center;margin:auto;font-size:29px}
.nama{font-weight:bold;color:#176b45;margin-top:8px;overflow-wrap:anywhere}
.keterangan{font-size:12px;color:#68766c;margin-top:5px;overflow-wrap:anywhere}
.relasi{font-size:11px;line-height:1.45;color:#526258;margin-top:7px;text-align:left;border-top:1px solid #edf1ed;padding-top:6px;white-space:pre-line}
.status-meninggal{color:#9a5555}
.garis-svg{position:absolute;left:0;top:0;z-index:1;pointer-events:none;overflow:visible}
.kosong{text-align:center;padding:28px;color:#66766b;background:white;border-radius:12px}
footer{text-align:center;padding:20px;color:#89958c;font-size:12px}

@media(max-width:480px){
header h2{font-size:19px}
.anggota{width:145px}
.lapisan{gap:12px}
}
</style>
</head>

<body>

<header>
<h2>🌳 Pohon Keluarga Bani Yasroji</h2>
<p>Hubungan ayah, ibu, pasangan, dan keturunan</p>
<a href="index.html" class="kembali">← Kembali ke Beranda</a>
</header>

<div class="container">
<div id="status" class="status">Memuat data keluarga...</div>

<div class="toolbar">
<button id="muatUlang">↻ Muat ulang</button>
<button id="zoomOut">− Perkecil</button>
<button id="zoomIn">＋ Perbesar</button>
</div>

<div class="petunjuk">Geser ke kiri/kanan untuk melihat seluruh pohon keluarga.</div>
<div id="pohon" class="pohon"></div>
</div>

<footer>© 2026 Silsilah Keluarga Bani Yasroji</footer>

<script type="module">
import {db} from "./js/firebase.js";
import {
 collection,getDocs
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const status=document.getElementById('status');
const pohon=document.getElementById('pohon');
let skala=1;

const norm=v=>(v||'').trim().toLocaleLowerCase('id');

function buatKartu(a,byName){
 const box=document.createElement('div');
 box.className='anggota '+(norm(a.jenisKelamin)==='perempuan'?'perempuan':'');
 box.dataset.id=a.id;

 if(a.fotoUrl){
  const im=document.createElement('img');
  im.className='foto';
  im.alt='Foto '+(a.nama||'anggota');
  im.src=a.fotoUrl;
  im.onerror=()=>{
   const av=document.createElement('div');
   av.className='avatar';
   av.textContent=norm(a.jenisKelamin)==='perempuan'?'👵':'👤';
   im.replaceWith(av);
  };
  box.append(im);
 }else{
  const av=document.createElement('div');
  av.className='avatar';
  av.textContent=norm(a.jenisKelamin)==='perempuan'?'👵':'👤';
  box.append(av);
 }

 const n=document.createElement('div');
 n.className='nama';
 n.textContent=a.nama||'Tanpa nama';
 box.append(n);

 const k=document.createElement('div');
 k.className='keterangan '+(norm(a.statusHidup)==='meninggal'?'status-meninggal':'');
 k.textContent=a.statusHidup||'';
 box.append(k);

 const rel=document.createElement('div');
 rel.className='relasi';

 const ayah=byName.get(norm(a.ayah));
 const ibu=byName.get(norm(a.ibu));

 rel.textContent=
 'Ayah: '+(ayah?.nama||a.ayah||'—')+
 '\nIbu: '+(ibu?.nama||a.ibu||'—')+
 '\nPasangan: '+(a.pasangan||'—');

 box.append(rel);
 return box;
}

function gambarGaris(){
 const lama=pohon.querySelector('.garis-svg');
 if(lama)lama.remove();

 const w=Math.max(pohon.scrollWidth,pohon.clientWidth);
 const h=Math.max(pohon.scrollHeight,pohon.clientHeight);

 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
 svg.setAttribute('class','garis-svg');
 svg.setAttribute('width',w);
 svg.setAttribute('height',h);
 svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
 svg.style.width=w+'px';
 svg.style.height=h+'px';
 pohon.prepend(svg);

 const rect=pohon.getBoundingClientRect();

 const posisi=new Map(
  [...pohon.querySelectorAll('.anggota')].map(el=>{
   const r=el.getBoundingClientRect();
   return [el.dataset.id,{
    x:r.left-rect.left+pohon.scrollLeft+r.width/2,
    top:r.top-rect.top+pohon.scrollTop,
    bottom:r.bottom-rect.top+pohon.scrollTop,
    left:r.left-rect.left+pohon.scrollLeft,
    right:r.right-rect.left+pohon.scrollLeft,
    y:r.top-rect.top+pohon.scrollTop+r.height/2
   }];
  })
 );

 const data=window.__keluarga||[];
 const byName=new Map(data.map(a=>[norm(a.nama),a]));
 const ns='http://www.w3.org/2000/svg';

 function path(d,color='#39865d',width=3){
  const el=document.createElementNS(ns,'path');
  el.setAttribute('d',d);
  el.setAttribute('fill','none');
  el.setAttribute('stroke',color);
  el.setAttribute('stroke-width',width);
  el.setAttribute('stroke-linecap','round');
  el.setAttribute('stroke-linejoin','round');
  svg.append(el);
 }

 // Garis hubungan orang tua dan anak
 data.forEach(a=>{
  const c=posisi.get(a.id);
  if(!c)return;

  const parents=[
   byName.get(norm(a.ayah)),
   byName.get(norm(a.ibu))
  ].filter(Boolean).map(p=>posisi.get(p.id)).filter(Boolean);

  if(!parents.length)return;

  const joinY=c.top-17;

  if(parents.length===1){
   const p=parents[0];
   const mid=(p.bottom+joinY)/2;
   path(`M ${p.x} ${p.bottom} V ${mid} H ${c.x} V ${c.top}`);
  }else{
   const xs=parents.map(p=>p.x);
   const center=xs.reduce((x,y)=>x+y,0)/xs.length;

   parents.forEach(p=>{
    const mid=(p.bottom+joinY)/2;
    path(`M ${p.x} ${p.bottom} V ${mid} H ${center} V ${joinY}`);
   });

   path(`M ${center} ${joinY} H ${c.x} V ${c.top}`);
  }
 });

 // Garis suami dan istri
 data.forEach(a=>{
  if(!a.pasangan)return;

  const b=byName.get(norm(a.pasangan));
  if(!b||String(a.id)>String(b.id))return;

  const pa=posisi.get(a.id);
  const pb=posisi.get(b.id);

  if(!pa||!pb||Math.abs(pa.y-pb.y)>45)return;

  const left=pa.x<pb.x?pa:pb;
  const right=pa.x<pb.x?pb:pa;
  const y=(pa.y+pb.y)/2;

  const l=document.createElementNS(ns,'line');
  l.setAttribute('x1',left.right);
  l.setAttribute('y1',y);
  l.setAttribute('x2',right.left);
  l.setAttribute('y2',y);
  l.setAttribute('stroke','#c58b2c');
  l.setAttribute('stroke-width','3');
  svg.append(l);

  const label=document.createElementNS(ns,'text');
  label.setAttribute('x',(left.right+right.left)/2);
  label.setAttribute('y',y-7);
  label.setAttribute('text-anchor','middle');
  label.setAttribute('font-size','10');
  label.setAttribute('font-weight','bold');
  label.setAttribute('fill','#9a6b18');
  label.setAttribute('stroke','#fff');
  label.setAttribute('stroke-width','4');
  label.setAttribute('paint-order','stroke');
  label.textContent='SUAMI ISTRI';
  svg.append(label);
 });
}

function render(data){
 pohon.innerHTML='';
 window.__keluarga=data;

 if(!data.length){
  pohon.innerHTML='<div class="kosong">Belum ada anggota keluarga yang dimasukkan.</div>';
  status.textContent='Data keluarga masih kosong.';
  return;
 }

 const byName=new Map(data.map(a=>[norm(a.nama),a]));
 const depth=new Map();

 // Menghitung generasi berdasarkan ayah dan ibu
 function getDepth(a,seen=new Set()){
  if(depth.has(a.id))return depth.get(a.id);
  if(seen.has(a.id))return 0;

  seen.add(a.id);

  const parents=[
   byName.get(norm(a.ayah)),
   byName.get(norm(a.ibu))
  ].filter(Boolean);

  const val=parents.length
   ?Math.max(...parents.map(p=>getDepth(p,new Set(seen))))+1
   :0;

  depth.set(a.id,val);
  return val;
 }

 data.forEach(a=>getDepth(a));

 // Menyamakan generasi pasangan
 for(let pass=0;pass<data.length;pass++){
  let changed=false;

  data.forEach(a=>{
   const b=byName.get(norm(a.pasangan));
   if(!b)return;

   const d=Math.max(depth.get(a.id)||0,depth.get(b.id)||0);

   if(depth.get(a.id)!==d){
    depth.set(a.id,d);
    changed=true;
   }

   if(depth.get(b.id)!==d){
    depth.set(b.id,d);
    changed=true;
   }
  });

  if(!changed)break;
 }

 // Mengelompokkan suami dan istri
 const used=new Set();
 const groups=[];

 data.forEach(a=>{
  if(used.has(a.id))return;

  const b=byName.get(norm(a.pasangan));

  if(b&&!used.has(b.id)&&b.id!==a.id){
   groups.push([a,b]);
   used.add(a.id);
   used.add(b.id);
  }else{
   groups.push([a]);
   used.add(a.id);
  }
 });

 const levels=[...new Set(depth.values())].sort((a,b)=>a-b);

 levels.forEach((lv,i)=>{
  const title=document.createElement('div');
  title.className='judul';
  title.textContent='GENERASI '+(i+1);
  pohon.append(title);

  const row=document.createElement('div');
  row.className='lapisan';

  groups.filter(g=>g.some(a=>depth.get(a.id)===lv)).forEach(g=>{
   const col=document.createElement('div');
   col.className='kolom';

   g.forEach((a,index)=>{
    if(index===1){
     const label=document.createElement('div');
     label.className='pasangan-label';
     label.textContent='SUAMI\nISTRI';
     col.append(label);
    }

    col.append(buatKartu(a,byName));
   });

   row.append(col);
  });

  pohon.append(row);
 });

 status.textContent='Berhasil memuat '+data.length+
 ' anggota keluarga dalam '+levels.length+' generasi.';

 requestAnimationFrame(()=>requestAnimationFrame(gambarGaris));

 pohon.querySelectorAll('img').forEach(im=>{
  if(!im.complete){
   im.addEventListener('load',()=>requestAnimationFrame(gambarGaris),{once:true});
  }
 });
}

async function muat(){
 status.textContent='Memuat data keluarga...';

 try{
  const snap=await getDocs(collection(db,'anggota'));
  const data=snap.docs.map(d=>({id:d.id,...d.data()}));
  render(data);
 }catch(e){
  console.error(e);
  status.textContent='Gagal memuat data. Periksa koneksi internet dan aturan Firestore.';
 }
}

document.getElementById('muatUlang').onclick=muat;

document.getElementById('zoomIn').onclick=()=>{
 skala=Math.min(1.5,skala+0.1);
 pohon.style.zoom=skala;
 requestAnimationFrame(gambarGaris);
};

document.getElementById('zoomOut').onclick=()=>{
 skala=Math.max(0.6,skala-0.1);
 pohon.style.zoom=skala;
 requestAnimationFrame(gambarGaris);
};

window.addEventListener('resize',()=>requestAnimationFrame(gambarGaris));

await muat();
</script>

</body>
</html>
