<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pohon Silsilah Keluarga</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6f4;
  color: #222;
}

header {
  background: #176b45;
  color: white;
  text-align: center;
  padding: 16px 10px;
}

header h2 {
  margin: 0;
}

#status {
  text-align: center;
  padding: 12px;
  color: #555;
}

.area {
  width: 100%;
  height: 75vh;
  overflow: auto;
  padding: 15px;
  touch-action: pan-x pan-y;
}

.pohon {
  min-width: 100%;
  width: max-content;
  padding: 15px;
}

.generasi {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 35px;
  position: relative;
}

.judul-generasi {
  background: #176b45;
  color: white;
  padding: 10px 22px;
  border-radius: 20px;
  font-weight: bold;
  margin-bottom: 18px;
}

.daftar-keluarga {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  flex-wrap: nowrap;
  gap: 22px;
}

.keluarga {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 8px;
  background: #e4f1e8;
  border: 1px solid #b5d5bf;
  border-radius: 12px;
}

.kartu {
  width: 135px;
  min-height: 105px;
  background: white;
  border: 2px solid #258457;
  border-radius: 12px;
  padding: 9px;
  text-align: center;
  box-shadow: 0 2px 6px #0002;
}

.kartu img {
  width: 55px;
  height: 55px;
  object-fit: cover;
  border-radius: 50%;
  display: block;
  margin: 0 auto 6px;
}

.nama {
  font-weight: bold;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.label {
  color: #666;
  font-size: 11px;
  margin-top: 5px;
}

.love {
  font-size: 23px;
  color: #e53965;
}

.penghubung {
  width: 3px;
  height: 25px;
  background: #80b99a;
  margin: 0 auto;
}

.daftar-belum {
  padding: 15px;
  font-size: 13px;
  color: #9b3333;
}

button {
  border: 0;
  background: #176b45;
  color: white;
  padding: 10px 16px;
  border-radius: 8px;
  margin: 5px;
}

@media(max-width:600px) {
  .area {
    height: 75vh;
    padding: 8px;
  }

  .daftar-keluarga {
    gap: 12px;
  }

  .kartu {
    width: 120px;
  }

  .keluarga {
    gap: 5px;
  }
}
</style>
</head>

<body>

<header>
  <h2>🌳 Silsilah Keluarga</h2>
  <div>Bani Yasroji</div>
</header>

<div id="status">Memuat data keluarga...</div>

<div style="text-align:center">
  <button onclick="location.reload()">Muat ulang</button>
</div>

<div class="area">
  <div class="pohon" id="pohon"></div>
</div>

<div class="daftar-belum" id="daftarBelum"></div>

<script type="module">

import { db } from "./js/firebase.js";

import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const status = document.getElementById("status");
const pohon = document.getElementById("pohon");
const daftarBelum = document.getElementById("daftarBelum");

let anggota = [];

function normal(teks) {
  return (teks || "").trim().toLowerCase();
}

function cariPasangan(orang) {
  if (!orang.pasangan) return null;

  return anggota.find(a =>
    normal(a.nama) === normal(orang.pasangan)
  ) || null;
}

function buatKartu(orang, label) {

  const kartu = document.createElement("div");
  kartu.className = "kartu";

  if (orang.fotoUrl) {
    const img = document.createElement("img");
    img.src = orang.fotoUrl;
    img.alt = "Foto " + orang.nama;
    kartu.appendChild(img);
  }

  const nama = document.createElement("div");
  nama.className = "nama";
  nama.textContent = orang.nama || "Tanpa nama";

  const keterangan = document.createElement("div");
  keterangan.className = "label";
  keterangan.textContent = label || "";

  kartu.append(nama, keterangan);

  return kartu;
}

function angkaUrutan(teks) {

  const urutan = [
    "pertama",
    "kedua",
    "ketiga",
    "keempat",
    "kelima",
    "keenam",
    "ketujuh",
    "kedelapan",
    "kesembilan",
    "kesepuluh"
  ];

  const nilai = normal(teks);

  for (let i = 0; i < urutan.length; i++) {
    if (nilai.includes(urutan[i])) return i + 1;
  }

  return 999;
}

function urutkan(data) {

  return [...data].sort((a, b) => {

    const ua = angkaUrutan(a.urutan);
    const ub = angkaUrutan(b.urutan);

    if (ua !== ub) return ua - ub;

    return (a.nama || "").localeCompare(b.nama || "");
  });
}

function namaLabel(generasi) {

  const label = {
    1: "Generasi 1 - Kakek/Nenek",
    2: "Generasi 2 - Anak",
    3: "Generasi 3 - Cucu",
    4: "Generasi 4 - Cicit",
    5: "Generasi 5 - Canggah",
    6: "Generasi 6 - Wareng"
  };

  return label[generasi] || "Generasi " + generasi;
}

function labelAnggota(orang, generasi) {

  if (orang.urutan) return orang.urutan;

  const label = {
    1: "Kakek / Nenek",
    2: "Anak / Menantu",
    3: "Cucu / Menantu",
    4: "Cicit / Menantu",
    5: "Canggah",
    6: "Wareng"
  };

  return label[generasi] || "";
}

function buatKeluarga(orang, generasi, sudahTampil) {

  const keluarga = document.createElement("div");
  keluarga.className = "keluarga";

  keluarga.appendChild(
    buatKartu(orang, labelAnggota(orang, generasi))
  );

  sudahTampil.add(normal(orang.nama));

  const pasangan = cariPasangan(orang);

  if (
    pasangan &&
    normal(pasangan.nama) !== normal(orang.nama) &&
    Number(pasangan.generasi) === generasi &&
    !sudahTampil.has(normal(pasangan.nama))
  ) {

    const love = document.createElement("div");
    love.className = "love";
    love.textContent = "❤️";

    keluarga.appendChild(love);

    keluarga.appendChild(
      buatKartu(pasangan, labelAnggota(pasangan, generasi))
    );

    sudahTampil.add(normal(pasangan.nama));
  }

  return keluarga;
}

async function tampilkanSilsilah() {

  try {

    const hasil = await getDocs(collection(db, "anggota"));

    anggota = hasil.docs.map(d => ({
      id: d.id,
      ...d.data()
    }));

    pohon.innerHTML = "";
    daftarBelum.innerHTML = "";

    if (anggota.length === 0) {
      status.textContent = "Belum ada data anggota keluarga.";
      return;
    }

    const sudahTampil = new Set();

    let jumlahGenerasi = 0;

    for (let g = 1; g <= 6; g++) {

      const dataGenerasi = urutkan(
        anggota.filter(a => Number(a.generasi) === g)
      );

      if (dataGenerasi.length === 0) continue;

      jumlahGenerasi++;

      const bagian = document.createElement("section");
      bagian.className = "generasi";

      const judul = document.createElement("div");
      judul.className = "judul-generasi";
      judul.textContent = namaLabel(g);

      const daftar = document.createElement("div");
      daftar.className = "daftar-keluarga";

      for (const orang of dataGenerasi) {

        if (sudahTampil.has(normal(orang.nama))) continue;

        daftar.appendChild(
          buatKeluarga(orang, g, sudahTampil)
        );
      }

      bagian.append(judul, daftar);

      if (jumlahGenerasi > 1) {

        const penghubung = document.createElement("div");
        penghubung.className = "penghubung";

        pohon.appendChild(penghubung);
      }

      pohon.appendChild(bagian);
    }

    const belum = anggota.filter(a =>
      !a.generasi || Number(a.generasi) < 1 ||
      Number(a.generasi) > 6
    );

    status.textContent =
      "Jumlah anggota: " + anggota.length +
      " | Generasi ditampilkan: " + jumlahGenerasi;

    if (belum.length > 0) {

      const judul = document.createElement("b");
      judul.textContent = "Anggota yang belum diberi generasi:";

      daftarBelum.appendChild(judul);
      daftarBelum.appendChild(document.createElement("br"));

      belum.forEach(a => {
        const baris = document.createElement("div");
        baris.textContent = a.nama;
        daftarBelum.appendChild(baris);
      });
    }

  } catch (error) {

    console.error(error);

    status.textContent =
      "Gagal memuat data. Periksa koneksi dan Firebase.";

  }
}

tampilkanSilsilah();

</script>

</body>
</html>
