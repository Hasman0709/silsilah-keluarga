<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pohon Silsilah Bani Yasroji</title><style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #edf6e9;
  color: #24452e;
}

header {
  background: #08712f;
  color: white;
  text-align: center;
  padding: 22px 10px;
}

header h2 {
  margin: 5px;
}

header a {
  color: white;
  text-decoration: none;
}

.container {
  padding: 12px;
  max-width: 1200px;
  margin: auto;
}

.panel {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px #0001;
}

button {
  background: #087b35;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 11px 16px;
  font-size: 14px;
  margin: 4px;
}

.pohon {
  overflow-x: auto;
  padding: 20px 5px;
  text-align: center;
}

.level {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 20px;
  min-width: max-content;
  margin: 0 auto;
  position: relative;
}

.cabang {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}

.kartu {
  background: white;
  border: 2px solid #168443;
  border-radius: 12px;
  width: 155px;
  padding: 12px 8px;
  margin: 5px;
  box-shadow: 0 3px 8px #0002;
  position: relative;
  z-index: 1;
}

.kartu img {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  object-fit: cover;
  background: #e8eee8;
}

.avatar {
  width: 65px;
  height: 65px;
  margin: auto;
  border-radius: 50%;
  background: #e0f0e3;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
}

.nama {
  font-weight: bold;
  font-size: 14px;
  margin-top: 8px;
  overflow-wrap: anywhere;
}

.urutan {
  color: #08712f;
  font-size: 12px;
  font-weight: bold;
  margin-top: 5px;
}

.info {
  font-size: 11px;
  color: #667568;
  margin-top: 5px;
}

.pasangan {
  font-size: 11px;
  color: #b32645;
  margin-top: 7px;
}

.penghubung {
  width: 2px;
  height: 28px;
  background: #168443;
}

.anak-anak {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 12px;
  padding-top: 0;
  position: relative;
}

.anak-anak::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  width: calc(100% - 155px);
  height: 2px;
  background: #168443;
  transform: translateX(-50%);
}

.anak-cabang {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}

.anak-cabang::before {
  content: "";
  width: 2px;
  height: 20px;
  background: #168443;
}

.kosong {
  color: #777;
  padding: 20px;
}

.tabel {
  overflow-x: auto;
}

@media(max-width:600px) {
  .kartu {
    width: 135px;
  }

  .anak-anak {
    gap: 8px;
  }
}
</style></head><body><header>
  <h2>🌳 POHON SILSILAH KELUARGA</h2>
  <h3>BANI YASROJI</h3>
  <p><a href="index.html">← Halaman Utama</a></p>
</header><div class="container">  <div class="panel">
    <h3>Bagan Keluarga</h3>
    <p>Geser ke kanan atau kiri untuk melihat seluruh anggota keluarga.</p>
    <button onclick="muatData()">🔄 Perbarui Silsilah</button>
    <p id="status">Mengambil data keluarga...</p>
  </div>  <div class="panel">
    <div class="pohon" id="pohon">
      Memuat pohon keluarga...
    </div>
  </div>  <div class="panel">
    <h3>Anggota Belum Terhubung</h3>
    <div id="belumTerhubung"></div>
  </div></div><script type="module">

import { db } from "./js/firebase.js";

import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

let anggota = [];

const pohon = document.getElementById("pohon");
const status = document.getElementById("status");
const belumTerhubung = document.getElementById("belumTerhubung");

function buatKartu(a) {

  const kartu = document.createElement("div");
  kartu.className = "kartu";

  if (a.fotoUrl) {

    const img = document.createElement("img");
    img.src = a.fotoUrl;
    img.alt = "Foto " + (a.nama || "");

    img.onerror = () => {
      img.replaceWith(buatAvatar(a));
    };

    kartu.appendChild(img);

  } else {

    kartu.appendChild(buatAvatar(a));

  }

  const nama = document.createElement("div");
  nama.className = "nama";
  nama.textContent = a.nama || "Tanpa nama";

  const urutan = document.createElement("div");
  urutan.className = "urutan";
  urutan.textContent = a.urutan || "";

  const info = document.createElement("div");
  info.className = "info";
  info.textContent = a.statusHidup || "";

  const pasangan = document.createElement("div");
  pasangan.className = "pasangan";

  if (a.pasangan) {
    pasangan.textContent = "♥ " + a.pasangan;
  }

  kartu.append(nama, urutan, info, pasangan);

  return kartu;
}

function buatAvatar(a) {

  const avatar = document.createElement("div");
  avatar.className = "avatar";

  avatar.textContent =
    a.jenisKelamin === "Perempuan" ? "👩" : "👨";

  return avatar;
}

function cariAnak(orang) {

  return anggota.filter(a => {

    const ayahCocok =
      a.ayah &&
      orang.nama &&
      a.ayah.trim().toLowerCase() ===
      orang.nama.trim().toLowerCase();

    const ibuCocok =
      a.ibu &&
      orang.nama &&
      a.ibu.trim().toLowerCase() ===
      orang.nama.trim().toLowerCase();

    return ayahCocok || ibuCocok;

  });

}

function buatCabang(orang, kedalaman = 0, jalur = []) {

  const cabang = document.createElement("div");
  cabang.className = "cabang";

  cabang.appendChild(buatKartu(orang));

  if (kedalaman >= 4) return cabang;

  const anak = cariAnak(orang).filter(a =>
    !jalur.includes(a.id)
  );

  if (anak.length === 0) return cabang;

  const garis = document.createElement("div");
  garis.className = "penghubung";

  cabang.appendChild(garis);

  const kelompok = document.createElement("div");
  kelompok.className = "anak-anak";

  anak.forEach(a => {

    const anakCabang = document.createElement("div");
    anakCabang.className = "anak-cabang";

    anakCabang.appendChild(
      buatCabang(
        a,
        kedalaman + 1,
        [...jalur, orang.id]
      )
    );

    kelompok.appendChild(anakCabang);

  });

  cabang.appendChild(kelompok);

  return cabang;
}

function render() {

  pohon.innerHTML = "";
  belumTerhubung.innerHTML = "";

  if (anggota.length === 0) {

    pohon.textContent = "Belum ada anggota keluarga.";
    return;

  }

  const anakIds = new Set();

  anggota.forEach(a => {

    cariAnak(a).forEach(anak => {
      anakIds.add(anak.id);
    });

  });

  const akar = anggota.filter(a =>
    !anakIds.has(a.id)
  );

  if (akar.length === 0) {

    pohon.textContent =
      "Data belum bisa membentuk pohon. Periksa hubungan ayah dan ibu.";

    return;

  }

  const level = document.createElement("div");
  level.className = "level";

  akar.forEach(a => {

    level.appendChild(
      buatCabang(a, 0, [])
    );

  });

  pohon.appendChild(level);

  const terhubung = new Set();

  function tandai(orang, jalur = []) {

    if (!orang || jalur.includes(orang.id)) return;

    terhubung.add(orang.id);

    cariAnak(orang).forEach(a =>
      tandai(a, [...jalur, orang.id])
    );

  }

  akar.forEach(a => tandai(a));

  const belum = anggota.filter(a =>
    !terhubung.has(a.id)
  );

  if (belum.length === 0) {

    belumTerhubung.textContent =
      "Semua anggota sudah masuk dalam bagan.";

  } else {

    belum.forEach(a => {

      const item = document.createElement("p");

      item.textContent =
        a.nama + (a.urutan ? " — " + a.urutan : "");

      belumTerhubung.appendChild(item);

    });

  }

}

async function muatData() {

  status.textContent = "Mengambil data dari Firebase...";

  pohon.textContent = "Memuat...";

  try {

    const hasil = await getDocs(
      collection(db, "anggota")
    );

    anggota = hasil.docs.map(d => ({
      id: d.id,
      ...d.data()
    }));

    render();

    status.textContent =
      "Berhasil memuat " + anggota.length + " anggota keluarga.";

  } catch (error) {

    console.error(error);

    status.textContent =
      "Gagal mengambil data. Periksa koneksi dan aturan Firestore.";

    pohon.textContent = "Data tidak dapat dimuat.";

  }

}

window.muatData = muatData;

muatData();

</script></body>
</html>
