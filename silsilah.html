<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pohon Silsilah Keluarga</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6f4;
  color: #222;
}

header {
  background: #176b45;
  color: white;
  text-align: center;
  padding: 16px 10px;
}

header h2 {
  margin: 0;
}

#status {
  text-align: center;
  padding: 12px;
  color: #555;
}

.area {
  width: 100%;
  height: 75vh;
  overflow: auto;
  padding: 25px;
  touch-action: pan-x pan-y;
}

.pohon {
  display: flex;
  align-items: flex-start;
  gap: 45px;
  width: max-content;
  min-width: 100%;
  padding: 20px;
}

.keluarga {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}

.orangtua {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-bottom: 35px;
}

.cabang {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 25px;
  position: relative;
}

.anak-cabang {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 145px;
  position: relative;
}

.kartu {
  width: 145px;
  min-height: 110px;
  background: white;
  border: 2px solid #258457;
  border-radius: 12px;
  padding: 9px;
  text-align: center;
  box-shadow: 0 2px 6px #0002;
}

.kartu img {
  width: 55px;
  height: 55px;
  object-fit: cover;
  border-radius: 50%;
  display: block;
  margin: 0 auto 6px;
}

.nama {
  font-weight: bold;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.label {
  color: #666;
  font-size: 11px;
  margin-top: 5px;
}

.hubungan {
  font-size: 24px;
  color: #e53965;
  line-height: 30px;
  margin: 4px 0;
}

.turunan {
  margin-top: 20px;
  padding-top: 20px;
  border-top: 2px solid #80b99a;
}

.keterangan {
  text-align: center;
  font-size: 12px;
  color: #666;
  margin: 10px;
}

button {
  border: 0;
  background: #176b45;
  color: white;
  padding: 10px 16px;
  border-radius: 8px;
  margin: 5px;
}

.daftar {
  padding: 15px;
  font-size: 13px;
  color: #9b3333;
}

@media(max-width:600px) {
  .area {
    height: 75vh;
    padding: 10px;
  }

  .pohon {
    gap: 25px;
    padding: 10px;
  }

  .cabang {
    gap: 15px;
  }
}
</style>
</head>

<body>

<header>
  <h2>🌳 Silsilah Keluarga</h2>
  <div>Bani Yasroji</div>
</header>

<div id="status">Memuat data keluarga...</div>

<div style="text-align:center">
  <button onclick="location.reload()">Muat ulang</button>
</div>

<div class="area" id="area">
  <div class="pohon" id="pohon"></div>
</div>

<div class="daftar" id="daftarBelum"></div>

<script type="module">
import { db } from "./js/firebase.js";

import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const status = document.getElementById("status");
const pohon = document.getElementById("pohon");
const daftarBelum = document.getElementById("daftarBelum");

let anggota = [];
let sudahTampil = new Set();

function normal(teks) {
  return (teks || "").trim().toLowerCase();
}

function cariNama(nama) {
  return anggota.find(a => normal(a.nama) === normal(nama));
}

function pasanganOrang(orang) {
  if (!orang || !orang.pasangan) return null;
  return cariNama(orang.pasangan);
}

function buatKartu(orang, label) {
  const kartu = document.createElement("div");
  kartu.className = "kartu";

  if (orang.fotoUrl) {
    const img = document.createElement("img");
    img.src = orang.fotoUrl;
    img.alt = "Foto " + orang.nama;
    kartu.appendChild(img);
  }

  const nama = document.createElement("div");
  nama.className = "nama";
  nama.textContent = orang.nama || "Tanpa nama";
  kartu.appendChild(nama);

  const keterangan = document.createElement("div");
  keterangan.className = "label";
  keterangan.textContent = label || "";
  kartu.appendChild(keterangan);

  return kartu;
}

function pasanganSalingTerhubung(a, b) {
  if (!a || !b) return false;

  return normal(a.pasangan) === normal(b.nama) ||
         normal(b.pasangan) === normal(a.nama);
}

function anakDari(ayah, ibu) {
  const namaAyah = normal(ayah?.nama);
  const namaIbu = normal(ibu?.nama);

  return anggota.filter(a => {
    const aAyah = normal(a.ayah);
    const aIbu = normal(a.ibu);

    if (!namaAyah && !namaIbu) return false;

    if (namaAyah && namaIbu) {
      return (
        (aAyah === namaAyah && aIbu === namaIbu) ||
        (aAyah === namaIbu && aIbu === namaAyah)
      );
    }

    const namaOrangtua = namaAyah || namaIbu;

    return aAyah === namaOrangtua ||
           aIbu === namaOrangtua;
  });
}

function urutkan(data) {
  return [...data].sort((a, b) => {
    const ua = parseInt(a.urutan) || 9999;
    const ub = parseInt(b.urutan) || 9999;

    if (ua !== ub) return ua - ub;

    return (a.nama || "").localeCompare(b.nama || "");
  });
}

function buatCabang(orang, pasangan, level = 0) {
  if (!orang) return null;

  const kunci = normal(orang.nama);

  if (sudahTampil.has(kunci)) return null;

  sudahTampil.add(kunci);

  const cabang = document.createElement("div");
  cabang.className = "anak-cabang";

  const labelAnak =
    level === 0 ? "Anak" :
    level === 1 ? "Cucu" :
    level === 2 ? "Cicit" : "Keturunan";

  cabang.appendChild(buatKartu(orang, labelAnak));

  if (pasangan) {
    const love = document.createElement("div");
    love.className = "hubungan";
    love.textContent = "❤️";
    cabang.appendChild(love);

    const kunciPasangan = normal(pasangan.nama);

    if (!sudahTampil.has(kunciPasangan)) {
      sudahTampil.add(kunciPasangan);
      cabang.appendChild(
        buatKartu(pasangan, "Menantu")
      );
    }
  }

  const anakBerikutnya = urutkan(
    anakDari(orang, pasangan)
  );

  const turunan = document.createElement("div");
  turunan.className = "turunan";

  const cabangBerikutnya = document.createElement("div");
  cabangBerikutnya.className = "cabang";

  let adaTurunan = false;

  for (const anak of anakBerikutnya) {
    if (sudahTampil.has(normal(anak.nama))) continue;

    const pasanganAnak = pasanganOrang(anak);

    const hasil = buatCabang(
      anak,
      pasanganAnak,
      level + 1
    );

    if (hasil) {
      cabangBerikutnya.appendChild(hasil);
      adaTurunan = true;
    }
  }

  if (adaTurunan) {
    turunan.appendChild(cabangBerikutnya);
    cabang.appendChild(turunan);
  }

  return cabang;
}

function buatKeluarga(orang) {
  const pasangan = pasanganOrang(orang);

  const keluarga = document.createElement("div");
  keluarga.className = "keluarga";

  const orangtua = document.createElement("div");
  orangtua.className = "orangtua";

  if (!sudahTampil.has(normal(orang.nama))) {
    sudahTampil.add(normal(orang.nama));
    orangtua.appendChild(buatKartu(orang, "Kakek / Nenek"));
  }

  if (pasangan &&
      !sudahTampil.has(normal(pasangan.nama))) {
    sudahTampil.add(normal(pasangan.nama));
    orangtua.appendChild(buatKartu(pasangan, "Pasangan"));
  }

  keluarga.appendChild(orangtua);

  const anak = urutkan(anakDari(orang, pasangan));

  const cabang = document.createElement("div");
  cabang.className = "cabang";

  let adaAnak = false;

  for (const a of anak) {
    if (sudahTampil.has(normal(a.nama))) continue;

    const hasil = buatCabang(
      a,
      pasanganOrang(a),
      0
    );

    if (hasil) {
      cabang.appendChild(hasil);
      adaAnak = true;
    }
  }

  if (adaAnak) {
    keluarga.appendChild(cabang);
  }

  return keluarga;
}

async function tampilkanSilsilah() {
  try {
    const hasil = await getDocs(collection(db, "anggota"));

    anggota = hasil.docs.map(d => ({
      id: d.id,
      ...d.data()
    }));

    pohon.innerHTML = "";
    sudahTampil.clear();

    if (anggota.length === 0) {
      status.textContent = "Belum ada data anggota keluarga.";
      return;
    }

    // Nama yang sudah tercatat sebagai anak.
    const namaAnak = new Set();

    anggota.forEach(a => {
      if (a.ayah) namaAnak.add(normal(a.ayah));
      if (a.ibu) namaAnak.add(normal(a.ibu));
    });

    // Nama yang tercatat sebagai pasangan tidak dijadikan akar.
    const namaPasangan = new Set();

    anggota.forEach(a => {
      if (a.pasangan) {
        namaPasangan.add(normal(a.pasangan));
      }
    });

    // Akar adalah anggota tanpa ayah/ibu dan bukan menantu
    // yang hanya tercatat sebagai pasangan.
    const akar = anggota.filter(a => {
      return !a.ayah &&
             !a.ibu &&
             !namaPasangan.has(normal(a.nama));
    });

    if (akar.length === 0) {
      status.textContent =
        "Belum ditemukan anggota keluarga paling atas. Periksa data ayah dan ibu.";
      return;
    }

    // Tampilkan akar yang belum pernah ditampilkan.
    for (const orang of akar) {
      if (sudahTampil.has(normal(orang.nama))) continue;

      pohon.appendChild(buatKeluarga(orang));
    }

    const belum = anggota.filter(a =>
      !sudahTampil.has(normal(a.nama))
    );

    status.textContent =
      "Jumlah anggota: " + anggota.length +
      " | Berhasil ditampilkan: " +
      (anggota.length - belum.length);

    if (belum.length > 0) {
      daftarBelum.innerHTML =
        "<b>Belum terhubung dalam pohon:</b><br>" +
        belum.map(a => a.nama).join(", ") +
        "<br><small>Periksa isian nama ayah dan ibu anggota tersebut.</small>";
    }

  } catch (error) {
    console.error(error);
    status.textContent =
      "Gagal memuat data. Periksa koneksi dan pengaturan Firebase.";
  }
}

tampilkanSilsilah();
</script>

</body>
</html>
