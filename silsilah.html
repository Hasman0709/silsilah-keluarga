<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pohon Keluarga Bani Yasroji</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f2f7f3;color:#26352b}header{background:#176b45;color:#fff;padding:18px 12px;text-align:center}header h2{margin:4px;font-size:21px}header p{margin:7px 0}.kembali{color:white;display:inline-block;margin-top:8px}.container{padding:14px 10px}.status{background:white;padding:13px;border-radius:12px;margin:8px auto 14px;max-width:700px;text-align:center;box-shadow:0 2px 8px #0001}.toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px}.toolbar button{border:0;border-radius:20px;padding:9px 15px;background:#176b45;color:#fff;font-weight:bold}.petunjuk{text-align:center;color:#66766b;font-size:12px;margin:8px}.pohon{position:relative;overflow:auto;padding:12px 10px 35px;min-height:120px}.lapisan{position:relative;z-index:2;display:flex;justify-content:center;align-items:stretch;gap:18px;width:max-content;min-width:100%;margin:0 auto 22px}.kolom{display:flex;flex-direction:column;align-items:center;gap:8px}.judul{font-weight:bold;color:#176b45;text-align:center;margin:12px 0 10px}.anggota{width:158px;background:white;padding:11px 9px;border-radius:14px;box-shadow:0 3px 10px #0002;border-top:4px solid #198754;text-align:center;position:relative}.anggota.perempuan{border-top-color:#bd6b9b}.foto{width:66px;height:66px;object-fit:cover;background:#e3f1e7;border-radius:50%;display:block;margin:auto}.avatar{width:66px;height:66px;border-radius:50%;background:#e3f1e7;display:grid;place-items:center;margin:auto;font-size:29px}.nama{font-weight:bold;color:#176b45;margin-top:8px;overflow-wrap:anywhere}.keterangan{font-size:12px;color:#68766c;margin-top:5px;overflow-wrap:anywhere}.relasi{font-size:11px;line-height:1.45;color:#526258;margin-top:7px;text-align:left;border-top:1px solid #edf1ed;padding-top:6px}.status-meninggal{color:#9a5555}.garis-svg{position:absolute;left:0;top:0;z-index:1;pointer-events:none;overflow:visible}.kosong{text-align:center;padding:28px;color:#66766b;background:white;border-radius:12px}footer{text-align:center;padding:20px;color:#89958c;font-size:12px}
@media(max-width:480px){header h2{font-size:19px}.anggota{width:145px}.lapisan{gap:12px}}
</style></head>
<body>
<header><h2>🌳 Pohon Keluarga Bani Yasroji</h2><p>Hubungan ayah, ibu, pasangan, dan keturunan</p><a href="index.html" class="kembali">← Kembali ke Beranda</a></header>
<div class="container"><div id="status" class="status">Memuat data keluarga...</div><div class="toolbar"><button id="muatUlang">↻ Muat ulang</button><button id="zoomOut">− Perkecil</button><button id="zoomIn">＋ Perbesar</button></div><div class="petunjuk">Geser ke kiri/kanan untuk melihat seluruh pohon keluarga.</div><div id="pohon" class="pohon"></div></div>
<footer>© 2026 Silsilah Keluarga Bani Yasroji</footer>
<script type="module">
import {db} from "./js/firebase.js";
import {collection,getDocs} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
const status=document.getElementById('status'),pohon=document.getElementById('pohon');let skala=1;
const norm=v=>(v||'').trim().toLocaleLowerCase('id');
function buatKartu(a,byName){const box=document.createElement('div');box.className='anggota '+(norm(a.jenisKelamin)==='perempuan'?'perempuan':'');box.dataset.id=a.id;
if(a.fotoUrl){const im=document.createElement('img');im.className='foto';im.alt='Foto '+(a.nama||'anggota');im.src=a.fotoUrl;im.onerror=()=>{const av=document.createElement('div');av.className='avatar';av.textContent=norm(a.jenisKelamin)==='perempuan'?'👵':'👤';im.replaceWith(av)};box.append(im)}else{const av=document.createElement('div');av.className='avatar';av.textContent=norm(a.jenisKelamin)==='perempuan'?'👵':'👤';box.append(av)}
const n=document.createElement('div');n.className='nama';n.textContent=a.nama||'Tanpa nama';box.append(n);const k=document.createElement('div');k.className='keterangan '+(norm(a.statusHidup)==='meninggal'?'status-meninggal':'');k.textContent=a.statusHidup||'';box.append(k);
const rel=document.createElement('div');rel.className='relasi';const ayah=byName.get(norm(a.ayah)),ibu=byName.get(norm(a.ibu));rel.textContent='Ayah: '+(ayah?.nama||a.ayah||'—')+'\nIbu: '+(ibu?.nama||a.ibu||'—')+'\nPasangan: '+(a.pasangan||'—');rel.style.whiteSpace='pre-line';box.append(rel);return box}
function gambarGaris(){const lama=pohon.querySelector('.garis-svg');if(lama)lama.remove();const w=pohon.scrollWidth,h=pohon.scrollHeight;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','garis-svg');svg.setAttribute('width',w);svg.setAttribute('height',h);svg.style.width=w+'px';svg.style.height=h+'px';pohon.prepend(svg);
const posisi=new Map([...pohon.querySelectorAll('.anggota')].map(el=>{const r=el.getBoundingClientRect(),p=pohon.getBoundingClientRect();return [el.dataset.id,{x:r.left-p.left+pohon.scrollLeft+r.width/2,top:r.top-p.top+pohon.scrollTop,bottom:r.bottom-p.top+pohon.scrollTop,left:r.left-p.left+pohon.scrollLeft,right:r.right-p.left+pohon.scrollLeft}]}));
const data=window.__keluarga||[];const byName=new Map(data.map(a=>[norm(a.nama),a]));const ns='http://www.w3.org/2000/svg';function line(x1,y1,x2,y2,color='#64a982',dash=''){const l=document.createElementNS(ns,'path');const mid=(y1+y2)/2;l.setAttribute('d',`M ${x1} ${y1} V ${mid} H ${x2} V ${y2}`);l.setAttribute('fill','none');l.setAttribute('stroke',color);l.setAttribute('stroke-width','2.2');if(dash)l.setAttribute('stroke-dasharray',dash);svg.append(l)}
data.forEach(a=>{const child=posisi.get(a.id);if(!child)return;const parents=[byName.get(norm(a.ayah)),byName.get(norm(a.ibu))].filter(Boolean);parents.forEach(par=>{const pp=posisi.get(par.id);if(pp)line(pp.x,pp.bottom,child.x,child.top)})});
// Garis pasangan hanya sebagai penghubung visual jika kedua nama cocok.
data.forEach(a=>{if(!a.pasangan)return;const b=byName.get(norm(a.pasangan));if(!b||a.id>b.id)return;const pa=posisi.get(a.id),pb=posisi.get(b.id);if(pa&&pb&&Math.abs(pa.top-pb.top)<35){const y=Math.min(pa.top,pb.top)+32;const l=document.createElementNS(ns,'line');l.setAttribute('x1',pa.x);l.setAttribute('y1',y);l.setAttribute('x2',pb.x);l.setAttribute('y2',y);l.setAttribute('stroke','#bd8b42');l.setAttribute('stroke-width','2.5');l.setAttribute('stroke-dasharray','5 4');svg.append(l)}});
}
function render(data){pohon.innerHTML='';window.__keluarga=data;if(!data.length){pohon.innerHTML='<div class="kosong">Belum ada anggota keluarga yang dimasukkan.</div>';status.textContent='Data keluarga masih kosong.';return}
const byName=new Map(data.map(a=>[norm(a.nama),a]));const depth=new Map();function getDepth(a,seen=new Set()){if(depth.has(a.id))return depth.get(a.id);if(seen.has(a.id))return 0;seen.add(a.id);const parents=[byName.get(norm(a.ayah)),byName.get(norm(a.ibu))].filter(Boolean);const val=parents.length?Math.max(...parents.map(p=>getDepth(p,new Set(seen))))+1:0;depth.set(a.id,val);return val}data.forEach(a=>getDepth(a));const levels=[...new Set(depth.values())].sort((a,b)=>a-b);
levels.forEach((lv,i)=>{const title=document.createElement('div');title.className='judul';title.textContent='GENERASI '+(i+1);pohon.append(title);const row=document.createElement('div');row.className='lapisan';data.filter(a=>depth.get(a.id)===lv).forEach(a=>{const col=document.createElement('div');col.className='kolom';col.append(buatKartu(a,byName));row.append(col)});pohon.append(row)});
status.textContent='Berhasil memuat '+data.length+' anggota keluarga dalam '+levels.length+' generasi.';requestAnimationFrame(()=>requestAnimationFrame(gambarGaris));}
async function muat(){status.textContent='Memuat data keluarga...';try{const snap=await getDocs(collection(db,'anggota'));const data=snap.docs.map(d=>({id:d.id,...d.data()}));render(data)}catch(e){console.error(e);status.textContent='Gagal memuat data. Periksa koneksi internet dan aturan Firestore.'}}
document.getElementById('muatUlang').onclick=muat;document.getElementById('zoomIn').onclick=()=>{skala=Math.min(1.5,skala+.1);pohon.style.zoom=skala;requestAnimationFrame(gambarGaris)};document.getElementById('zoomOut').onclick=()=>{skala=Math.max(.6,skala-.1);pohon.style.zoom=skala;requestAnimationFrame(gambarGaris)};window.addEventListener('resize',()=>requestAnimationFrame(gambarGaris));await muat();
</script></body></html>
