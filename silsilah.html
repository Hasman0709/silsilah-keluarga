<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pohon Silsilah Keluarga</title><style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6f4;
  color: #222;
}

header {
  background: #176b45;
  color: white;
  padding: 15px;
  text-align: center;
}

header h2 {
  margin: 0;
  font-size: 20px;
}

header p {
  margin: 5px 0 0;
  font-size: 13px;
}

.info {
  padding: 10px;
  text-align: center;
  font-size: 13px;
  color: #555;
}

#cariNama {
  width: 65%;
  max-width: 300px;
  padding: 11px;
  border: 1px solid #aaa;
  border-radius: 7px;
  font-size: 14px;
}

.info button {
  padding: 11px 16px;
  border: none;
  border-radius: 7px;
  background: #176b45;
  color: white;
  font-weight: bold;
}

#hasilCari {
  margin-top: 8px;
  font-weight: bold;
}

.area {
  width: 100%;
  height: calc(100vh - 165px);
  overflow: auto;
  background: #fff;
  touch-action: pan-x pan-y;
  overscroll-behavior: contain;
}

.pohon {
  display: inline-block;
  min-width: 100%;
  padding: 25px;
  transform-origin: top left;
}

.keluarga {
  display: flex;
  flex-direction: row;
  align-items: center;
  width: max-content;
  position: relative;
}

.orangtua {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px;
  border: 2px solid #176b45;
  border-radius: 12px;
  background: #e8f5ed;
  min-width: 180px;
  position: relative;
  z-index: 1;
}

.anak-anak {
  display: flex;
  flex-direction: column;
  gap: 22px;
  margin-left: 35px;
  padding-left: 25px;
  border-left: 2px solid #83ad91;
  position: relative;
}

.anak-anak:empty {
  display: none;
}

.unit-anak {
  display: flex;
  align-items: center;
  position: relative;
}

.unit-anak::before {
  content: "";
  position: absolute;
  left: -27px;
  top: 50%;
  width: 27px;
  border-top: 2px solid #83ad91;
}

.unit-anak > .keluarga {
  align-items: center;
}

.kartu {
  width: 145px;
  min-height: 75px;
  border: 1px solid #bbb;
  border-radius: 9px;
  background: white;
  padding: 7px;
  text-align: center;
  box-shadow: 0 2px 5px #00000012;
  flex-shrink: 0;
}

.kartu.laki {
  border-top: 4px solid #2684c7;
}

.kartu.perempuan {
  border-top: 4px solid #df719e;
}

.kartu img {
  width: 42px;
  height: 42px;
  object-fit: cover;
  border-radius: 50%;
  margin-bottom: 4px;
  background: #eee;
}

.nama {
  font-size: 12px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.label {
  font-size: 10px;
  color: #666;
  margin-top: 4px;
}

.hubungan {
  font-size: 10px;
  color: #176b45;
  font-weight: bold;
  margin-bottom: 4px;
}

.jantung {
  color: #d83255;
  font-size: 18px;
  padding: 0 2px;
}

.kartu.ditemukan {
  background: #fff2a8;
  border: 3px solid #e59b00;
}

.pesan {
  padding: 20px;
  text-align: center;
  color: #777;
}
</style></head><body><header>
  <h2>POHON SILSILAH KELUARGA</h2>
  <p>Keluarga Bani Yasroji</p>
</header><div class="info">
  <input
    type="search"
    id="cariNama"
    placeholder="Cari nama anggota keluarga..."
  >
  <button id="tombolCari">Cari</button>  <div id="hasilCari"></div>  <p>Jepit dua jari untuk memperbesar atau memperkecil pohon silsilah.</p>
</div><div class="area" id="area">
  <div class="pohon" id="pohon">
    <div class="pesan">Memuat data silsilah...</div>
  </div>
</div><script type="module">
import { db } from "./js/firebase.js";

import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const pohon = document.getElementById("pohon");
const area = document.getElementById("area");

let semuaAnggota = [];
let zoomLevel = 1;
let jarakAwal = 0;
let zoomAwal = 1;

function teks(nilai) {
  return String(nilai || "").trim();
}

function cariPasangan(orang) {
  if (!orang || !orang.pasangan) return null;

  return semuaAnggota.find(a =>
    teks(a.nama).toLowerCase() === teks(orang.pasangan).toLowerCase()
  ) || null;
}

function pasanganSama(a, b) {
  if (!a || !b) return false;

  return (
    teks(a.pasangan).toLowerCase() === teks(b.nama).toLowerCase() ||
    teks(b.pasangan).toLowerCase() === teks(a.nama).toLowerCase()
  );
}

function cocokOrangtua(anak, ayah, ibu) {
  if (!anak || !ayah || !ibu) return false;

  const namaAyah = teks(anak.ayah).toLowerCase();
  const namaIbu = teks(anak.ibu).toLowerCase();

  const nama1 = teks(ayah.nama).toLowerCase();
  const nama2 = teks(ibu.nama).toLowerCase();

  return (
    (namaAyah === nama1 && namaIbu === nama2) ||
    (namaAyah === nama2 && namaIbu === nama1)
  );
}

function angkaUrutan(nilai) {
  const kata = teks(nilai).toLowerCase();

  const daftar = [
    "pertama", "kedua", "ketiga", "keempat",
    "kelima", "keenam", "ketujuh", "kedelapan",
    "kesembilan", "kesepuluh"
  ];

  for (let i = 0; i < daftar.length; i++) {
    if (kata.includes(daftar[i])) return i + 1;
  }

  const angka = kata.match(/\d+/);
  return angka ? Number(angka[0]) : 999;
}

function urutkanAnak(data) {
  return data.sort((a, b) => {
    const beda = angkaUrutan(a.urutan) - angkaUrutan(b.urutan);

    if (beda !== 0) return beda;

    return teks(a.nama).localeCompare(teks(b.nama), "id");
  });
}

function buatKartu(orang, label) {
  const kartu = document.createElement("div");

  const jenis = teks(orang.jenisKelamin).toLowerCase();

  kartu.className = "kartu " +
    (jenis.includes("perempuan") || jenis.includes("wanita")
      ? "perempuan"
      : "laki");

  const gambar = document.createElement("img");

  gambar.src = teks(orang.fotoUrl) || "data:image/svg+xml," +
    encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="100%" height="100%" fill="#eeeeee"/><circle cx="40" cy="29" r="14" fill="#aaaaaa"/><path d="M12 78 Q15 48 40 48 Q65 48 68 78" fill="#aaaaaa"/></svg>'
    );

  gambar.alt = "Foto anggota";

  gambar.onerror = () => {
    gambar.style.display = "none";
  };

  const nama = document.createElement("div");
  nama.className = "nama";
  nama.textContent = teks(orang.nama);

  const keterangan = document.createElement("div");
  keterangan.className = "label";
  keterangan.textContent = teks(orang.statusHidup);

  const hubungan = document.createElement("div");
  hubungan.className = "hubungan";
  hubungan.textContent = label || "";

  kartu.appendChild(gambar);
  kartu.appendChild(hubungan);
  kartu.appendChild(nama);
  kartu.appendChild(keterangan);

  return kartu;
}

function buatKeluarga(ayah, ibu, generasi, sudahTampil) {
  const keluarga = document.createElement("div");
  keluarga.className = "keluarga";

  const kotakOrangtua = document.createElement("div");
  kotakOrangtua.className = "orangtua";

  kotakOrangtua.appendChild(
    buatKartu(ayah, generasi === 1 ? "Kakek" : "Ayah")
  );

  const hati = document.createElement("span");
  hati.className = "jantung";
  hati.textContent = "♥";
  kotakOrangtua.appendChild(hati);

  kotakOrangtua.appendChild(
    buatKartu(ibu, generasi === 1 ? "Nenek" : "Ibu")
  );

  keluarga.appendChild(kotakOrangtua);

  if (generasi >= 6) return keluarga;

  const anak = urutkanAnak(
    semuaAnggota.filter(a =>
      cocokOrangtua(a, ayah, ibu) &&
      !sudahTampil.has(a.id)
    )
  );

  if (anak.length === 0) return keluarga;

  const daftarAnak = document.createElement("div");
  daftarAnak.className = "anak-anak";

  anak.forEach((orang, index) => {
    if (sudahTampil.has(orang.id)) return;

    sudahTampil.add(orang.id);

    const pasangan = cariPasangan(orang);

    let pasanganValid = pasangan &&
      pasangan.id !== orang.id &&
      pasanganSama(orang, pasangan);

    if (pasanganValid && sudahTampil.has(pasangan.id)) {
      pasanganValid = false;
    }

    if (pasanganValid) {
      sudahTampil.add(pasangan.id);
    }

    const unit = document.createElement("div");
    unit.className = "unit-anak";

    const keluargaAnak = document.createElement("div");
    keluargaAnak.className = "keluarga";

    const kotak = document.createElement("div");
    kotak.className = "orangtua";

    kotak.appendChild(
      buatKartu(
        orang,
        teks(orang.urutan) || `Anak ke-${index + 1}`
      )
    );

    if (pasanganValid) {
      const hatiAnak = document.createElement("span");
      hatiAnak.className = "jantung";
      hatiAnak.textContent = "♥";
      kotak.appendChild(hatiAnak);

      kotak.appendChild(
        buatKartu(pasangan, "Pasangan")
      );
    }

    keluargaAnak.appendChild(kotak);

    if (pasanganValid) {
      const cabang = buatKeluarga(
        orang,
        pasangan,
        generasi + 1,
        sudahTampil
      );

      const anakCabang = cabang.querySelector(".anak-anak");

      if (anakCabang) {
        keluargaAnak.appendChild(anakCabang);
      }
    }

    unit.appendChild(keluargaAnak);
    daftarAnak.appendChild(unit);
  });

  keluarga.appendChild(daftarAnak);

  return keluarga;
}

async function tampilkanSilsilah() {
  try {
    const hasil = await getDocs(collection(db, "anggota"));

    semuaAnggota = hasil.docs.map(doc => ({
      id: doc.id,
      ...doc.data()
    }));

    pohon.innerHTML = "";

    const sudahTampil = new Set();

    const akar = semuaAnggota.filter(a =>
      Number(a.generasi) === 1 &&
      !teks(a.ayah) &&
      !teks(a.ibu) &&
      !teks(a.urutan).toLowerCase().startsWith("menantu")
    );

    if (akar.length === 0) {
      pohon.innerHTML =
        '<div class="pesan">Data kakek dan nenek belum ditemukan. Pastikan generasi kakek dan nenek diisi 1.</div>';
      return;
    }

    akar.forEach(orang => {
      if (sudahTampil.has(orang.id)) return;

      const pasangan = cariPasangan(orang);

      if (!pasangan || !pasanganSama(orang, pasangan)) return;
      if (sudahTampil.has(pasangan.id)) return;

      sudahTampil.add(orang.id);
      sudahTampil.add(pasangan.id);

      const keluarga = buatKeluarga(
        orang,
        pasangan,
        1,
        sudahTampil
      );

      pohon.appendChild(keluarga);
    });

    if (pohon.children.length === 0) {
      pohon.innerHTML =
        '<div class="pesan">Pasangan kakek dan nenek belum terhubung. Periksa kolom pasangan pada data anggota.</div>';
    }

  } catch (error) {
    console.error(error);

    pohon.innerHTML =
      '<div class="pesan">Gagal memuat silsilah. Periksa koneksi internet dan pengaturan Firebase.</div>';
  }
}

/* FITUR PENCARIAN */

function cariAnggotaKeluarga() {
  const input = document.getElementById("cariNama");
  const hasil = document.getElementById("hasilCari");
  const kata = input.value.trim().toLowerCase();

  document.querySelectorAll(".kartu").forEach(kartu => {
    kartu.classList.remove("ditemukan");
  });

  if (!kata) {
    hasil.textContent = "Masukkan nama anggota keluarga.";
    return;
  }

  const kartuDitemukan = [...document.querySelectorAll(".kartu")]
    .find(kartu => {
      const nama = kartu.querySelector(".nama");

      return nama &&
        nama.textContent.toLowerCase().includes(kata);
    });

  if (!kartuDitemukan) {
    hasil.textContent = "Nama tidak ditemukan dalam pohon silsilah.";
    return;
  }

  kartuDitemukan.classList.add("ditemukan");

  hasil.textContent = "Anggota keluarga ditemukan.";

  kartuDitemukan.scrollIntoView({
    behavior: "smooth",
    block: "center",
    inline: "center"
  });
}

document.getElementById("tombolCari")
  .addEventListener("click", cariAnggotaKeluarga);

document.getElementById("cariNama")
  .addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      cariAnggotaKeluarga();
    }
  });

/* ZOOM DENGAN JEPIT DUA JARI */

area.addEventListener("touchstart", function(e) {
  if (e.touches.length === 2) {
    jarakAwal = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );

    zoomAwal = zoomLevel;
  }
}, { passive: true });

area.addEventListener("touchmove", function(e) {
  if (e.touches.length === 2 && jarakAwal > 0) {
    e.preventDefault();

    const jarakSekarang = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );

    zoomLevel = Math.max(
      0.25,
      Math.min(2.5, zoomAwal * jarakSekarang / jarakAwal)
    );

    pohon.style.transform = `scale(${zoomLevel})`;
  }
}, { passive: false });

area.addEventListener("touchend", function(e) {
  if (e.touches.length < 2) {
    jarakAwal = 0;
  }
});

tampilkanSilsilah();

</script></body>
</html>
