<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pohon Silsilah Bani Yasroji</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#e8f5df;
color:#174b27;
}

header{
background:#08712d;
color:white;
text-align:center;
padding:22px 10px;
}

header h1{margin:0;font-size:25px}
header p{margin:8px 0}

header a{color:white}

.keterangan{
background:white;
padding:12px;
margin:12px;
border-radius:12px;
font-size:13px;
text-align:center;
}

.toolbar{
text-align:center;
padding:10px;
}

button{
border:0;
padding:10px 16px;
border-radius:8px;
background:#087b35;
color:white;
font-weight:bold;
}

.petunjuk{
text-align:center;
font-size:12px;
padding:8px;
color:#49644d;
}

.area{
overflow:auto;
padding:20px 12px 45px;
}

.pohon{
min-width:max-content;
margin:auto;
text-align:center;
}

.generasi{
display:flex;
justify-content:center;
align-items:flex-start;
gap:35px;
margin:25px auto;
}

.keluarga{
display:flex;
flex-direction:column;
align-items:center;
min-width:170px;
}

.pasangan{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
}

.kartu{
width:145px;
background:white;
border-radius:15px;
padding:10px 8px;
border:3px solid #16823d;
box-shadow:0 3px 8px #0002;
position:relative;
z-index:2;
}

.kartu.perempuan{
border-color:#d75b9c;
}

.kartu img{
width:75px;
height:75px;
border-radius:50%;
object-fit:cover;
background:#e4f1e4;
}

.avatar{
width:75px;
height:75px;
border-radius:50%;
margin:auto;
display:grid;
place-items:center;
background:#e4f1e4;
font-size:35px;
}

.nama{
font-weight:bold;
margin-top:8px;
overflow-wrap:anywhere;
}

.status{
font-size:11px;
color:#777;
margin-top:5px;
}

.hati{
font-size:25px;
color:red;
}

.garis-turun{
width:2px;
height:30px;
background:#333;
}

.anak-anak{
display:flex;
justify-content:center;
gap:25px;
border-top:2px solid #333;
padding-top:20px;
position:relative;
}

.anak-anak:before{
content:"";
position:absolute;
height:20px;
width:2px;
background:#333;
top:-20px;
left:50%;
}

.anak{
display:flex;
flex-direction:column;
align-items:center;
}

.anak .kartu{
width:135px;
}

.kosong{
padding:30px;
background:white;
border-radius:12px;
}

footer{
text-align:center;
padding:20px;
font-size:12px;
color:#55715b;
}
</style>
</head>

<body>

<header>
<h1>🌳 Pohon Silsilah Keluarga</h1>
<p><b>Bani Yasroji</b></p>
<a href="index.html">← Kembali ke Beranda</a>
</header>

<div class="keterangan">
❤️ Hubungan suami istri
<br><br>
│ Garis hubungan orang tua dan anak
</div>

<div class="toolbar">
<button id="muatUlang">↻ Muat Ulang</button>
</div>

<div class="petunjuk">
Geser ke kiri atau kanan untuk melihat pohon keluarga.
</div>

<div class="area">
<div id="pohon" class="pohon">
Memuat data keluarga...
</div>
</div>

<footer>
© 2026 Pohon Silsilah Keluarga Bani Yasroji
</footer>

<script type="module">
import {db} from "./js/firebase.js";

import {
collection,getDocs
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const pohon=document.getElementById("pohon");

const norm=v=>(v||"").trim().toLowerCase();

function kartu(a){
const box=document.createElement("div");

box.className="kartu "+
(norm(a.jenisKelamin)==="perempuan"?"perempuan":"");

if(a.fotoUrl){
const im=document.createElement("img");
im.src=a.fotoUrl;
im.alt=a.nama||"Foto anggota";

im.onerror=()=>{
im.remove();
const av=document.createElement("div");
av.className="avatar";
av.textContent=norm(a.jenisKelamin)==="perempuan"?"👩":"👨";
box.prepend(av);
};

box.append(im);
}else{
const av=document.createElement("div");
av.className="avatar";
av.textContent=norm(a.jenisKelamin)==="perempuan"?"👩":"👨";
box.append(av);
}

const nama=document.createElement("div");
nama.className="nama";
nama.textContent=a.nama||"Tanpa nama";

const status=document.createElement("div");
status.className="status";
status.textContent=a.statusHidup||"";

box.append(nama,status);

return box;
}

function cariNama(data,nama){
return data.find(a=>norm(a.nama)===norm(nama));
}

function buatPasangan(a,data){
const baris=document.createElement("div");
baris.className="pasangan";

baris.append(kartu(a));

const pasangan=cariNama(data,a.pasangan);

if(pasangan && pasangan.id!==a.id){
const hati=document.createElement("span");
hati.className="hati";
hati.textContent="❤️";
baris.append(hati,kartu(pasangan));
}

return baris;
}

function buatPohon(data){

pohon.innerHTML="";

if(!data.length){
pohon.innerHTML='<div class="kosong">Belum ada data keluarga.</div>';
return;
}

const sudah=new Set();

const akar=data.filter(a=>!a.ayah&&!a.ibu);

if(!akar.length){
pohon.innerHTML=
'<div class="kosong">Data orang tua belum diisi. Lengkapi nama ayah dan ibu pada data anggota.</div>';
return;
}

const lapisan=document.createElement("div");
lapisan.className="generasi";

akar.forEach(a=>{
if(sudah.has(a.id))return;

const keluarga=document.createElement("div");
keluarga.className="keluarga";

keluarga.append(buatPasangan(a,data));

const turun=document.createElement("div");
turun.className="garis-turun";
keluarga.append(turun);

const anak=data.filter(x=>
norm(x.ayah)===norm(a.nama) ||
norm(x.ibu)===norm(a.nama)
);

if(anak.length){
const daftar=document.createElement("div");
daftar.className="anak-anak";

anak.forEach(x=>{
if(sudah.has(x.id))return;
sudah.add(x.id);

const kolom=document.createElement("div");
kolom.className="anak";

kolom.append(buatPasangan(x,data));

const garis=document.createElement("div");
garis.className="garis-turun";
kolom.append(garis);

const cucu=data.filter(y=>
norm(y.ayah)===norm(x.nama) ||
norm(y.ibu)===norm(x.nama)
);

if(cucu.length){
const daftarCucu=document.createElement("div");
daftarCucu.className="anak-anak";

cucu.forEach(c=>{
if(sudah.has(c.id))return;
sudah.add(c.id);

const item=document.createElement("div");
item.className="anak";
item.append(kartu(c));
daftarCucu.append(item);
});

kolom.append(daftarCucu);
}

daftar.append(kolom);
});

keluarga.append(daftar);
}

lapisan.append(keluarga);
sudah.add(a.id);
});

pohon.append(lapisan);
}

async function muat(){
pohon.textContent="Memuat data keluarga...";

try{
const hasil=await getDocs(collection(db,"anggota"));

const data=hasil.docs.map(d=>({
id:d.id,...d.data()
}));

buatPohon(data);

}catch(e){
console.error(e);
pohon.textContent="Gagal memuat data. Periksa koneksi dan aturan Firestore.";
}
}

document.getElementById("muatUlang").onclick=muat;

muat();
</script>

</body>
</html>
